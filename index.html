<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA Unit 2 · Online course</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<style>
:root{--navy:#1d2b4f;--teal:#0f6b72;--teal-l:#e9f5f3;--purple:#5b3fa6;--purple-l:#f3effb;--orange:#ee9b2f;--orange-l:#fff7e9;--red:#d9434e;--red-l:#fdeced;--green:#2e8b57;--green-l:#e8f6ee;
--bg:#f6f7fb;--card:#fff;--ink:#1f2633;--muted:#5b6576;--line:#dde2ec;--code:#0f1729;--r:12px;--sh:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.lx{font-family:Lexend,Nunito,system-ui,sans-serif;line-height:1.25;margin:0}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.92em}
code{background:#eef1f7;border-radius:4px;padding:0 4px}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.small{font-size:.86rem;color:var(--muted)}
/* top bar */
.top{position:relative;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.top .brand{font-family:Lexend;font-weight:600;font-size:1.02rem;letter-spacing:.01em;cursor:pointer}
.top .brand small{display:block;font-weight:400;opacity:.75;font-size:.72rem}
.top .sp{flex:1}
.top .who{font-size:.9rem;opacity:.9}
.top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px}
.top button:hover{background:rgba(255,255,255,.22)}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;width:140px}
.bar>i{display:block;height:100%;background:var(--orange)}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 80px}
.wide{max-width:1400px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin:14px 0}
.btn{border:none;border-radius:9px;padding:9px 16px;font-weight:700;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#e6ebf3;color:var(--navy)}
.btn.warn{background:var(--red)}
.btn.or{background:var(--orange);color:#1f2633}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,107,114,.15)}
textarea:disabled,input:disabled,select:disabled{background:#f4f6fa;color:#334}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#1d2b4f 0%,#0f6b72 100%)}
.login .box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:28px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login h1{font-size:1.4rem;color:var(--navy)}
.login label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 4px}
.login .err{color:var(--red);font-size:.9rem;min-height:1.2em;margin-top:8px}
.login .ms{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1.5px solid #8a8886;color:#323130;border-radius:8px;padding:9px;font-weight:700;margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:14px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.demo-note{background:var(--orange-l);border:1px solid #f3cf95;border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
/* home */
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hello h1{font-size:1.5rem;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:Lexend;font-size:1.5rem;color:var(--navy)}
.week{margin:18px 0 8px;font-family:Lexend;font-weight:600;color:var(--navy);display:flex;align-items:baseline;gap:10px}
.week small{font-family:Nunito;font-weight:400;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px;cursor:pointer;border-left:6px solid #c7cfdd;transition:transform .08s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between}
.tile .t{font-weight:700;margin:4px 0 8px;line-height:1.3}
.tile .pb{height:6px;background:#eef1f7;border-radius:4px;overflow:hidden}
.tile .pb i{display:block;height:100%;background:var(--teal)}
.tile .st{font-size:.8rem;margin-top:6px;color:var(--muted)}
.tile.done{border-left-color:var(--green)}
.tile.prog{border-left-color:var(--orange)}
.tile.missed{border-left-color:var(--red);background:#fffafa}
.tile.fa{background:linear-gradient(0deg,#fff,#fff),var(--purple-l)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:20px;padding:1px 8px;letter-spacing:.03em}
.tag.b{background:var(--purple-l);color:var(--purple)}
.tag.c{background:var(--teal-l);color:var(--teal)}
.tag.m{background:var(--red-l);color:var(--red)}
.tag.d{background:var(--green-l);color:var(--green)}
.tag.f{background:var(--orange-l);color:#a2610a}
.todo li{margin:6px 0}
.prep{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.prep .card{margin:0}
.prep h3{font-size:1.05rem;color:var(--purple)}
.prep ul{padding-left:18px;margin:8px 0}
.lnk{cursor:pointer;color:var(--teal);text-decoration:underline}
/* lesson */
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:22px 24px;margin-top:6px}
.hero.fa{background:linear-gradient(135deg,#5b3fa6,#1d2b4f)}
.hero.sa{background:linear-gradient(135deg,#d9434e,#1d2b4f)}
.pills span{display:inline-block;background:rgba(255,255,255,.14);border-radius:20px;padding:2px 10px;font-size:.8rem;margin:0 6px 6px 0}
.hero h1{font-size:1.6rem;margin:6px 0 10px}
.hero .iq{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;font-size:.95rem}
.hero .iq b{font-size:.72rem;letter-spacing:.08em;display:block;opacity:.8}
.savebar{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;background:rgba(246,247,251,.95);backdrop-filter:blur(4px);padding:8px 2px;border-bottom:1px solid var(--line)}
.savebar .pb{flex:1;max-width:260px;height:8px;background:#e3e8f1;border-radius:6px;overflow:hidden}
.savebar .pb i{display:block;height:100%;background:var(--teal);transition:width .3s}
.saved{font-size:.85rem;color:var(--muted)}
.sec{font-family:Lexend;font-weight:600;font-size:1.15rem;color:var(--navy);margin:26px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{font-family:Nunito;font-weight:400;font-size:.85rem;color:var(--muted)}
.box{border-radius:var(--r);padding:16px 18px;margin:14px 0}
.case{background:var(--orange-l);border:1.5px solid #f3cf95}
.case h3{color:#8a4b00;font-size:1.15rem;margin:4px 0 8px}
.case .q{font-weight:700;margin-top:10px;color:var(--navy)}
.case img,.figure img{max-width:100%;border-radius:8px;display:block;margin:10px auto}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.goals{background:var(--teal-l);border:1.5px solid #9fd1cb}
.goal{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed #b9ddd8}
.goal:last-child{border:none}
.rate{display:inline-flex;gap:4px;align-items:center}
.rate .cap{font-size:.7rem;color:var(--muted);margin-right:2px}
.rate button{width:30px;height:30px;border-radius:50%;border:1.5px solid #9fb3c8;background:#fff;font-weight:800;color:var(--navy)}
.rate button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.key{background:#fff;border:1.5px solid var(--line)}
.key ul{margin:0;padding-left:20px}
.key li{margin:4px 0}
.warn{background:var(--red-l);border:1.5px solid #f2b7bc}
.warm{background:#fff;border:1.5px dashed var(--orange)}
.blk{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin:16px 0;overflow:hidden}
.blk .hd{background:var(--navy);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:Lexend;font-size:.95rem}
.blk .hd span:last-child{font-family:Nunito;opacity:.8;font-size:.85rem}
.walk{width:100%;border-collapse:collapse;font-size:.9rem}
.walk td{padding:4px 10px;border-bottom:1px solid #eef1f7;vertical-align:top}
.walk td.ln{width:28px;color:#8a94a6;text-align:right;font-family:"JetBrains Mono",monospace;font-size:.8rem}
.walk td.cd{font-family:"JetBrains Mono",monospace;white-space:pre;background:#f7f9fc;width:55%;font-size:.84rem}
.walk td.nt{color:#334}
.blk .body{padding:12px 14px}
.po{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.po{grid-template-columns:1fr}.walk td.cd{white-space:pre-wrap;word-break:break-word}}
.task{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border-top:5px solid var(--red);padding:14px 18px;margin:16px 0}
.task .tt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.task .tl{background:var(--red);color:#fff;border-radius:6px;padding:2px 9px;font-weight:800;font-size:.85rem}
.task h3{font-size:1.08rem}
.task .min{margin-left:auto;font-size:.82rem;color:var(--muted)}
.succ{background:var(--green-l);border-radius:8px;padding:7px 11px;margin-top:10px;font-size:.92rem}
.succ b{color:var(--green)}
table.grid{width:100%;border-collapse:collapse;margin:10px 0;table-layout:fixed}
table.grid th{background:#eef1f7;text-align:left;padding:7px 8px;font-size:.88rem;border:1px solid var(--line)}
table.grid td{border:1px solid var(--line);padding:4px;vertical-align:top;font-size:.92rem}
table.grid td.fx{padding:7px 8px;background:#fafbfd}
table.grid.c td,table.grid.c th{text-align:center}
table.grid textarea{border:none;border-radius:4px;padding:5px 6px;min-height:34px;resize:vertical;background:#fffef6}
table.grid textarea:focus{box-shadow:inset 0 0 0 2px var(--teal)}
table.grid.tall textarea{min-height:70px}
table.fixed{border-collapse:collapse;width:100%;margin:10px 0;background:#fff}
table.fixed th,table.fixed td{border:1px solid #e3d3b5;padding:5px 8px;font-size:.9rem;text-align:left}
table.fixed th{background:#fbe9c9}
.tblwrap{overflow-x:auto}
.note2{background:#f7f9fc;border-radius:8px;padding:8px 10px;margin:8px 0}
.field{margin:10px 0}
.field label{display:block;font-weight:700;font-size:.93rem;margin-bottom:4px}
/* code editor */
.ed{border:1.5px solid #c9d2e3;border-radius:10px;overflow:hidden;margin:10px 0;background:#fff}
.ed .bar2{display:flex;gap:8px;align-items:center;background:#eef1f7;padding:6px 8px;flex-wrap:wrap}
.ed .bar2 .t{font-size:.82rem;font-weight:700;color:var(--navy);margin-right:auto}
.ed .bar2 button{border:none;border-radius:7px;padding:5px 12px;font-weight:700;font-size:.85rem}
.run{background:var(--green);color:#fff}
.test{background:var(--purple);color:#fff}
.stop{background:var(--red);color:#fff}
.reset{background:#fff;color:var(--navy);border:1px solid #c9d2e3!important}
.ed textarea.src{border:none;border-radius:0;font-family:"JetBrains Mono",monospace;font-size:.88rem;line-height:1.5;min-height:120px;background:#fbfcfe;tab-size:4;white-space:pre;overflow:auto}
.ed .CodeMirror{height:auto;min-height:110px;font-family:"JetBrains Mono",monospace;font-size:.88rem;line-height:1.5}
.ed .CodeMirror-scroll{min-height:110px;max-height:520px}
.ed .stdin{display:flex;gap:8px;align-items:center;padding:6px 8px;background:#fff8e8;border-top:1px solid #f1dfb4;font-size:.85rem}
.ed .stdin input{padding:4px 8px}
.console{background:var(--code);color:#e3e9f5;font-family:"JetBrains Mono",monospace;font-size:.84rem;padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:38px;max-height:320px;overflow:auto}
.console .err{color:#ff9aa2}
.console .info{color:#8fb3ff}
.console .ok{color:#7ee2a8}
.testres{padding:8px 12px;font-size:.9rem;border-top:1px solid var(--line)}
.testres.pass{background:var(--green-l);color:#1e6b43}
.testres.fail{background:var(--red-l);color:#9b1c25}
.expected{font-size:.85rem;margin-top:8px}
.expected summary{cursor:pointer;color:var(--teal);font-weight:700}
.expected pre{background:#f4f6fa;border-radius:8px;padding:8px;margin:6px 0;white-space:pre-wrap}
/* flowchart */
.flow{display:grid;grid-template-columns:minmax(300px,1fr) minmax(260px,1fr);gap:14px;margin:10px 0}
@media(max-width:820px){.flow{grid-template-columns:1fr}}
.flow table{width:100%;border-collapse:collapse;font-size:.85rem}
.flow th{background:#eef1f7;padding:5px;text-align:left}
.flow td{padding:3px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.flow td input,.flow td select{padding:4px 6px;font-size:.85rem}
.flow .svgbox{border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:auto;max-height:720px}
.flow .tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.flow .x{border:none;background:none;color:var(--red);font-weight:800}
/* summative link, back, reflection */
.sum{display:flex;gap:14px;background:var(--purple-l);border:1.5px solid #cfc2ee;align-items:center}
.sum .badge{background:var(--purple);color:#fff;border-radius:10px;padding:8px 12px;text-align:center;font-size:.7rem;font-weight:800;letter-spacing:.06em}
.sum .badge b{display:block;font-size:1.6rem;font-family:Lexend}
.back{background:#fff;border:1.5px solid var(--teal)}
.refl{background:#fff;border:1.5px solid var(--navy)}
.soi{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.soi button{border:1.5px solid #c9d2e3;background:#fff;border-radius:20px;padding:5px 12px;font-size:.88rem}
.soi button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.atlrow{display:grid;grid-template-columns:1.2fr auto 1.6fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
@media(max-width:720px){.atlrow{grid-template-columns:1fr}}
.finish{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;margin-top:24px}
.fb{background:#fffbe6;border:1.5px solid #f0d36b}
.away-note{background:var(--red-l);color:#8d1b24;border-radius:10px;padding:8px 12px;font-size:.9rem;margin:10px 0}
.locked{background:#eef1f7;border:1.5px solid #c9d2e3}
.rubric{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
.rubric th,.rubric td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.rubric th{background:var(--purple-l)}
.rubric td:first-child{font-weight:800;width:56px;text-align:center}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.plan td,.plan th{padding:5px 8px}
.fsbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--purple);color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:.9rem;flex-wrap:wrap}
.fsbar button{background:#fff;color:var(--purple);border:none;border-radius:8px;padding:5px 12px;font-weight:800}
/* chart */
.chartfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.chart svg{width:100%;max-width:680px;background:#fff;border:1.5px solid var(--line);border-radius:10px;display:block;margin:10px 0}
/* teacher */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tabs button{border:none;background:#e6ebf3;color:var(--navy);border-radius:9px;padding:8px 14px;font-weight:700}
.tabs button.on{background:var(--navy);color:#fff}
.gridwrap{overflow:auto;max-height:72vh;background:#fff;border-radius:12px;box-shadow:var(--sh)}
table.prog{border-collapse:separate;border-spacing:0;font-size:.8rem}
table.prog th,table.prog td{border-bottom:1px solid #eef1f7;border-right:1px solid #eef1f7;padding:4px;text-align:center;white-space:nowrap}
table.prog th{position:sticky;top:0;background:#f4f6fa;z-index:2;font-weight:800}
table.prog td.nm,table.prog th.nm{position:sticky;left:0;background:#fff;z-index:3;text-align:left;min-width:180px;padding-left:10px}
table.prog th.nm{z-index:4;background:#f4f6fa}
table.prog td.cell{min-width:44px;cursor:pointer;font-weight:700;position:relative}
table.prog td.cell:hover{outline:2px solid var(--teal);outline-offset:-2px}
table.prog th.past{color:var(--navy)}
table.prog th.fa{background:var(--purple-l)}
.c0{background:#fff;color:#b8c0cd}.c1{background:#fde6e7;color:#9b1c25}.c2{background:#fff1d6;color:#8a5a00}.c3{background:#dff3e7;color:#1e6b43}.c4{background:#2e8b57;color:#fff}
.awaydot{position:absolute;top:1px;right:2px;font-size:.62rem;color:var(--red);font-weight:800}
.fbdot{position:absolute;bottom:0;right:2px;font-size:.6rem}
.online{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-right:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,41,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 10px}
.modal .inner{background:var(--bg);border-radius:16px;max-width:1000px;width:100%;padding:0 0 20px;position:relative}
.modal .mh{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;border-radius:16px 16px 0 0;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.modal .mh h3{font-size:1.05rem;flex:1}
.modal .mb{padding:0 18px}
.legend span{display:inline-block;padding:2px 8px;border-radius:6px;margin-right:6px;font-size:.8rem;font-weight:700}
.list{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}
.list th,.list td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.list th{background:#f4f6fa}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;box-shadow:var(--sh)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.top,.savebar,.finish,.ed .bar2{display:none}}

</style>
</head>

oi": "structure", "hexagons": null}, {"n": 5, "kind": "lesson", "week": 2, "date": "2026-10-21", "crit": "C", "title": "Functions as reusable processes and solutions", "iq": "How does logic influence the design and efficiency of digital solutions?", "atl": [["Thinking skills", "Identify connections between one reusable process (a function) and the many solutions that depend on it"], ["Social skills", "Facilitate group discussion: advantages and risks of reusing someone else’s code"]], "warm": "Role-play: one classmate is the function <code>left_pad<\/code>. Others “call” it with arguments on sticky notes and get the answer back.", "case": {"title": "left-pad: 11 lines that broke the internet", "text": "On <b>22 March 2016<\/b> a programmer removed his small code packages from npm, an online library of reusable JavaScript code. One of them, <b>left-pad<\/b>, was a function of only <b>11 lines<\/b>. Thousands of projects, such as React and Babel, reused it — and suddenly failed to build. npm put left-pad back about 2 hours later.", "img": "l05", "question": "Why do programmers reuse functions — and what happens when thousands of solutions depend on one small function?"}, "opinion": "“Always write all your code yourself.” Agree / Disagree, because …", "goals": ["<b>Describe<\/b> the parts of a function: <code>def<\/code>, parameters, arguments and <code>return<\/code>.", "<b>Construct<\/b> a function that returns a value.", "<b>Explain<\/b> why one small reused function could break thousands of projects."], "key": ["<code>def name(parameters):<\/code> defines a function <b>once<\/b>. A <b>call<\/b> runs it: <code>left_pad(\"7\", 3, \"0\")<\/code>.", "<b>Parameters<\/b> are the names in the definition; <b>arguments<\/b> are the values you send.", "<code>return<\/code> sends a value back so the program can use it. <code>print<\/code> only shows it on the screen."], "warn": null, "extra": null, "blocks": [{"k": "L05a", "title": "Define once, call many times", "predict": "How many lines are printed?", "note": null, "norun": false, "code": ["def congratulate(name):", "    print(\"Well done,\", name + \"!\")", "", "congratulate(\"Aigerim\")", "congratulate(\"Arman\")"], "notes": ["<code>def<\/code> defines a function; <code>name<\/code> is its <b>parameter<\/b>", "the body: what the function does (indented)", "", "<b>call<\/b> the function; \"Aigerim\" is the <b>argument<\/b>", "reuse: the same function, a new argument"], "output": "Well done, Aigerim!\nWell done, Arman!", "setup": []}, {"k": "L05b", "title": "Our own left-pad in Python", "predict": "Two outputs:", "note": null, "norun": false, "code": ["def left_pad(text, width, fill):", "    while len(text) < width:", "        text = fill + text", "    return text", "", "print(left_pad(\"5\", 3, \"0\"))", "print(left_pad(\"42\", 5, \"*\"))"], "notes": ["three parameters", "repeat while the text is too short", "add one fill character on the <b>left<\/b>", "<code>return<\/code> sends the result back to the caller", "", "call it and print the returned value", "the same function with other arguments"], "output": "005\n***42", "setup": ["def congratulate(name):\n    print(\"Well done,\", name + \"!\")\n\ncongratulate(\"Aigerim\")\ncongratulate(\"Arman\")"]}], "tasks": [{"label": "Task 1", "title": "Trace left_pad", "min": 6, "text": "Trace <code>left_pad(\"7\", 3, \"0\")<\/code>: one row for each check of the while condition.", "parts": [{"type": "table", "id": "L5.t0.p0", "head": ["Check", "len(text)", "len(text) &lt; 3 ?", "text after this check"], "rows": [["1", "", "", ""], ["2", "", "", ""], ["3", "", "", ""]], "w": [12, 18, 25, 45], "center": true, "nohead": false, "tall": false}, {"type": "field", "id": "L5.t0.p1", "label": "Returned value:"}], "success": "the last row shows the condition False and the returned value."}, {"label": "Task 2", "title": "Medal points", "min": 8, "text": "Gold = 3 points, silver = 2, bronze = 1. Write a function <code>medal_points(golds, silvers, bronzes)<\/code> that <b>returns<\/b> the points. Test it with <code>print(medal_points(40, 44, 42))<\/code> (USA).", "parts": [{"type": "code", "id": "L5.t1.p0", "n": 5, "setup": ["def congratulate(name):\n    print(\"Well done,\", name + \"!\")\n\ncongratulate(\"Aigerim\")\ncongratulate(\"Arman\")", "def left_pad(text, width, fill):\n    while len(text) < width:\n        text = fill + text\n    return text\n\nprint(left_pad(\"5\", 3, \"0\"))\nprint(left_pad(\"42\", 5, \"*\"))"], "test": {"cases": [{"post": "print('__T__', medal_points(40, 44, 42), medal_points(0, 0, 0), medal_points(1, 1, 1))", "expect": ["__T__ 250 0 6"], "srcHas": ["return"], "msg": "medal_points must RETURN 3×golds + 2×silvers + bronzes (USA: 250)."}]}}], "success": "your function returns 250 and uses return, not print."}], "summative": ["C", "In <b>Summative C<\/b> you write <code>selection_sort(data)<\/code> and <code>linear_search(data, target)<\/code> as <b>functions that return<\/b> results — and you call them many times with different data."], "back": "Answer the case question. Give <b>one advantage<\/b> and <b>one risk<\/b> of reusing a function written by someone else.", "exit": ["Which keyword starts a function definition?", "In <code>left_pad(\"5\", 3, \"0\")<\/code>, what are the arguments?"], "soi": "structure", "hexagons": null}, {"n": 6, "kind": "lesson", "week": 2, "date": "2026-10-23", "crit": "C", "title": "Testing and debugging Python solutions", "iq": "How can measurement help us select appropriate data structures and algorithms for different problems?", "atl": [["Research skills", "Use an organized process (input, expected, actual) to investigate a program"], ["Thinking skills", "Identify patterns in errors and connect each error to its type"]], "warm": "Pair programming: the <b>driver<\/b> types, the <b>navigator<\/b> checks the expected values. Swap after each block.", "case": {"title": "Mars Climate Orbiter: lost in the units", "text": "On <b>23 September 1999<\/b> NASA lost the Mars Climate Orbiter. One program gave results in pound-force seconds, but the other expected newton-seconds — about <b>4.45 times<\/b> different. No test checked that both programs used the same unit. The orbiter came in at about <b>57 km<\/b> above Mars instead of <b>226 km<\/b> and was lost. The mission cost $327.6 million.", "img": "l06", "question": "How could a simple test with a known expected answer have caught this bug?"}, "opinion": "“If a program runs without an error message, it is correct.” Agree / Disagree, because …", "goals": ["<b>Distinguish<\/b> between syntax errors, runtime errors and logic errors.", "<b>Test<\/b> a function by comparing the expected output with the actual output.", "<b>Use<\/b> a debugging print to find a logic error."], "key": ["<b>Syntax error<\/b> — Python cannot read the code; nothing runs. <b>Runtime error<\/b> — the program starts, then stops with a message.", "<b>Logic error<\/b> — no message, but a <b>wrong answer<\/b>. Only a test with an <b>expected output<\/b> finds it.", "A test: input → expected (by hand, <b>before<\/b> running) → run → actual → compare."], "warn": null, "extra": null, "blocks": [{"k": "L06a", "title": "A test finds a logic error", "predict": "Does the test pass?", "note": "Then fix line 2: <code>return pound_seconds * 4.45<\/code> and run again.", "norun": false, "code": ["def to_newton_seconds(pound_seconds):", "    return pound_seconds          # bug: no unit conversion", "", "expected = 44.5                   # worked out by hand: 10 × 4.45", "actual = to_newton_seconds(10)", "print(\"expected\", expected, \"actual\", actual)", "print(\"test passed:\", expected == actual)"], "notes": ["the function we want to test", "<b>bug<\/b>: it should multiply by 4.45", "", "<b>expected<\/b> — worked out by hand <b>before<\/b> running", "<b>actual<\/b> — what the program really gives", "show both values", "True only when they are equal"], "output": "expected 44.5 actual 10\ntest passed: False", "setup": []}, {"k": "L06b", "title": "Debugging with print", "predict": "What does the debug print show each time?", "note": null, "norun": false, "code": ["def lowest_height(heights_km):", "    lowest = 0", "    for height in heights_km:", "        print(\"lowest so far\", lowest)   # debugging print", "        if height < lowest:", "            lowest = height", "    return lowest", "", "print(lowest_height([226, 150, 57, 110]))"], "notes": ["", "<b>bug<\/b>: 0 is lower than every real height", "visit each height", "<b>debugging print<\/b> — shows the value inside the loop", "is this height lower than the lowest so far?", "remember the new lowest", "send the result back", "", "test with 4 heights"], "output": "lowest so far 0\nlowest so far 0\nlowest so far 0\nlowest so far 0\n0", "setup": ["def to_newton_seconds(pound_seconds):\n    return pound_seconds          # bug: no unit conversion\n\nexpected = 44.5                   # worked out by hand: 10 × 4.45\nactual = to_newton_seconds(10)\nprint(\"expected\", expected, \"actual\", actual)\nprint(\"test passed:\", expected == actual)"]}], "tasks": [{"label": "Task 1", "title": "Name the error type", "min": 7, "text": "Write <b>syntax<\/b>, <b>runtime<\/b> or <b>logic<\/b> and say how you know.", "parts": [{"type": "table", "id": "L6.t0.p0", "head": ["Code", "Error type", "How I know"], "rows": [["<code>print(\"Mars\"<\/code>", "", ""], ["<code>heights = [226, 57]<\/code><br><code>print(heights[2])<\/code>", "", ""], ["<code>average = (226 + 57) / 3<\/code> (2 heights)", "", ""], ["<code>if speed = 100:<\/code>", "", ""]], "w": [40, 18, 42], "center": false, "nohead": false, "tall": false}], "success": "every row has the right type."}, {"label": "Task 2", "title": "Fix lowest_height", "min": 7, "text": "Rewrite <b>line 2<\/b> of L06b so the function works for any list (hint: start with the first item, <code>heights_km[0]<\/code>). Write the whole fixed function, run it, and remove the debug print when it works.", "parts": [{"type": "code", "id": "L6.t1.p0", "n": 7, "setup": ["def to_newton_seconds(pound_seconds):\n    return pound_seconds          # bug: no unit conversion\n\nexpected = 44.5                   # worked out by hand: 10 × 4.45\nactual = to_newton_seconds(10)\nprint(\"expected\", expected, \"actual\", actual)\nprint(\"test passed:\", expected == actual)", "def lowest_height(heights_km):\n    lowest = 0\n    for height in heights_km:\n        print(\"lowest so far\", lowest)   # debugging print\n        if height < lowest:\n            lowest = height\n    return lowest\n\nprint(lowest_height([226, 150, 57, 110]))"], "test": {"cases": [{"post": "print('__T__', lowest_height([226, 150, 57, 110]), lowest_height([5]), lowest_height([-3, 10]))", "expect": ["__T__ 57 5 -3"], "msg": "lowest_height must work for any list: start with heights_km[0]."}]}}], "success": "the function returns 57."}], "summative": ["C", "The <b>Testing and debugging record<\/b> in Summative C is exactly today’s method: write the <b>expected<\/b> output first, run, record the <b>actual<\/b> output, and write down every bug and fix."], "back": "Answer the case question. Describe <b>one test<\/b> (input and expected output) that would have shown the unit bug.", "exit": ["What is the difference between the expected output and the actual output?", "Which type of error gives no error message?"], "soi": "structure", "hexagons": null}, {"n": 7, "kind": "lesson", "week": 3, "date": "2026-10-26", "crit": "C", "title": "Logic of classes and objects in Python", "iq": "What are the main types of data structures and how do they organize data?", "atl": [["Thinking skills", "Identify connections between real things (profiles, songs, cars) and the class, objects and attributes that describe them"], ["Social skills", "Facilitate group discussion: agree on the attributes a class needs"]], "warm": "Fill in a blank paper profile card. The blank card is the <b>class<\/b>; every filled card is an <b>object<\/b>.", "case": {"title": "Instagram: 3 billion users, one blueprint", "text": "In September 2025 Instagram announced <b>3 billion<\/b> monthly users. Its engineers wrote that Instagram runs on <b>Django<\/b>, a web framework written in Python. Every profile stores the same kinds of data — a username, a number of followers — but with different values. Programmers describe a profile <b>once<\/b> and create one <b>object<\/b> for each user.", "img": "l07", "question": "How does one class let a program organize data for billions of different users?"}, "opinion": "“Instagram programmers write new code for every new user.” Agree / Disagree, because …", "goals": ["<b>Describe<\/b> the difference between a class (blueprint) and an object.", "<b>Construct<\/b> a class with <code>__init__<\/code> and attributes, and create objects from it.", "<b>Use<\/b> a list of objects and a loop to process many users."], "key": ["A <b>class<\/b> is a blueprint (cookie cutter); an <b>object<\/b> is one thing made from it (a cookie).", "<b>Attributes<\/b> are the data every object has: <code>self.username<\/code>. <code>__init__<\/code> stores the starting values; <code>self<\/code> means “this object”.", "Class names start with a <b>capital letter<\/b>. Read an attribute with a dot: <code>chef.followers<\/code>."], "warn": null, "extra": null, "blocks": [{"k": "L07a", "title": "A class and two objects", "predict": "Two outputs:", "note": null, "norun": false, "code": ["class Profile:", "    def __init__(self, username, followers):", "        self.username = username", "        self.followers = followers", "", "runner = Profile(\"astana_runner\", 1251)", "chef = Profile(\"chef_dana\", 48900)", "print(runner.username)", "print(chef.followers)"], "notes": ["a class is a <b>blueprint<\/b>; class names start with a capital letter", "<code>__init__<\/code> runs when an object is created", "<code>self.<\/code> stores the value in <b>this<\/b> object", "", "", "create object 1", "object 2: same blueprint, different values", "a dot reads an <b>attribute<\/b>", ""], "output": "astana_runner\n48900", "setup": []}, {"k": "L07b", "title": "A list of objects", "predict": "Three lines:", "note": null, "norun": false, "code": ["users = [runner, chef, Profile(\"cs_class10\", 87)]", "for user in users:", "    print(user.username, user.followers)"], "notes": ["a list can hold objects", "visit each object", "read two attributes of each object"], "output": "astana_runner 1251\nchef_dana 48900\ncs_class10 87", "setup": ["class Profile:\n    def __init__(self, username, followers):\n        self.username = username\n        self.followers = followers\n\nrunner = Profile(\"astana_runner\", 1251)\nchef = Profile(\"chef_dana\", 48900)\nprint(runner.username)\nprint(chef.followers)"]}], "tasks": [{"label": "Task 1", "title": "Spot the class", "min": 6, "text": "For each real thing name a class and two attributes. Ask your partner: does <b>every<\/b> object have this attribute?", "parts": [{"type": "table", "id": "L7.t0.p0", "head": ["Real thing", "Class name", "Two attributes"], "rows": [["A song on Spotify", "", ""], ["A student in our school", "", ""], ["A car in a racing game", "", ""]], "w": [34, 24, 42], "center": false, "nohead": false, "tall": false}], "success": "every class name starts with a capital letter."}, {"label": "Task 2", "title": "Class Post", "min": 8, "text": "Write a class <code>Post<\/code> with the attributes <code>caption<\/code> and <code>likes<\/code> (copy the pattern of <code>Profile<\/code>). Create <code>cat = Post(\"My cat\", 1045)<\/code> and print its likes.", "parts": [{"type": "code", "id": "L7.t1.p0", "n": 7, "setup": ["class Profile:\n    def __init__(self, username, followers):\n        self.username = username\n        self.followers = followers\n\nrunner = Profile(\"astana_runner\", 1251)\nchef = Profile(\"chef_dana\", 48900)\nprint(runner.username)\nprint(chef.followers)", "users = [runner, chef, Profile(\"cs_class10\", 87)]\nfor user in users:\n    print( TION has its <b>END<\/b>.", "Flowchart: label <b>both<\/b> arrows from a diamond Yes / No; every loop arrow goes back to its decision; number every block."], "warn": null, "extra": {"type": "img", "src": "l13b", "w": 62, "caption": "The three-tries PIN flowchart — compare each shape with a line of L13a."}, "blocks": [{"k": "L13a", "title": "From flowchart to Python (three tries)", "predict": "Type 1234, then 1967. What is printed?", "note": "Then run again with 0000, 1111, 2222.", "norun": false, "code": ["correct_pin = \"1967\"", "tries = 0", "card_ok = False", "while tries < 3 and not card_ok:", "    pin = input(\"Enter PIN: \")", "    tries = tries + 1", "    if pin == correct_pin:", "        print(\"Take cash\")", "        card_ok = True", "    else:", "        print(\"Wrong PIN\")", "if not card_ok:", "    print(\"Card kept\")", "print(card_ok)"], "notes": ["the PIN is text", "a counter (flowchart: SET tries TO 0)", "becomes True when the PIN is right", "flowchart diamond: tries < 3? (and not yet correct)", "INPUT pin", "SET tries TO tries + 1", "DECISION: pin = \"1967\"?", "OUTPUT \"Take cash\"", "stops the loop", "", "OUTPUT \"Wrong PIN\"", "after the loop: was it never correct?", "OUTPUT \"Card kept\"", ""], "output": "Enter PIN: 1234\nWrong PIN\nEnter PIN: 1967\nTake cash\nTrue", "setup": []}], "tasks": [{"label": "Task 1", "title": "Write the pseudocode", "min": 8, "text": "An ATM asks for an <b>amount<\/b>. If the amount is less than or equal to the <b>balance<\/b>, the balance goes down by the amount and the ATM shows “Take cash”. Otherwise it shows “Not enough”.", "parts": [{"type": "pseudo", "id": "L13.t0.p0", "n": 7}], "success": "you use INPUT, IF … THEN … ELSE … END IF, SET … TO and OUTPUT, and indent 4 spaces inside the IF."}, {"label": "Task 2", "title": "Draw the flowchart", "min": 7, "text": "Draw the flowchart for your pseudocode. Then <b>swap<\/b> with a partner and tick each shape against each line.", "parts": [{"type": "flow", "id": "L13.t1.p0"}], "success": "the right shape for every line; both arrows leaving the diamond are labelled Yes and No."}], "summative": ["B", "Summative B is marked on exactly this: <b>standard symbols<\/b>, <b>numbered blocks<\/b>, <b>Yes/No labels<\/b>, and <b>pseudocode that matches the flowchart<\/b> line by line."], "back": "Answer the case question. Use the words <b>flowchart<\/b>, <b>pseudocode<\/b> and <b>decision<\/b>. Why is a limit of 3 tries safe even with a 4-digit PIN?", "exit": ["Which flowchart symbol is used for a decision?", "How many times does <code>FOR i FROM 1 TO 3 DO<\/code> repeat?"], "soi": "structure", "hexagons": null}, {"n": 14, "kind": "lesson", "week": 5, "date": "2026-11-11", "crit": "B", "title": "Bubble sort: logic of comparison and swap processes", "iq": "How can the efficiency of an algorithm be measured and compared?", "atl": [["Thinking skills", "Identify the pattern in the number of comparisons as the list grows"], ["Research skills", "Use an organized process (pass-by-pass trace) to measure comparisons and swaps"]], "warm": "5 classmates hold cards 5, 1, 4, 2, 8 and swap neighbours. The class says “swap” or “no swap” and counts on the board.", "case": {"title": "“Bubble sort would be the wrong way to go”", "text": "On <b>14 November 2007<\/b> Barack Obama visited Google. CEO Eric Schmidt asked him: “What is the most efficient way to sort a million 32-bit integers?” Obama answered: “Well, I think the bubble sort would be the wrong way to go.” Bubble sort is simple, but for <b>1,000,000<\/b> numbers it needs about <b>500 billion<\/b> comparisons.", "img": "l14", "question": "Why is bubble sort a good way to learn sorting, but the wrong way to sort a million numbers?"}, "opinion": "How many comparisons does bubble sort make for 5 cards? …", "goals": ["<b>Describe<\/b> how bubble sort compares neighbours and swaps them, pass by pass.", "<b>Construct<\/b> a pass-by-pass trace that counts comparisons and swaps.", "<b>Explain<\/b> why bubble sor g skills", "Identify the relationship between the size of a list and the number of checks"], ["Social skills", "Facilitate group discussion during the baggage-belt role-play"]], "warm": "8 tag cards face down on a “baggage belt”. One student searches for 6689, then for 1000; the class counts the checks.", "case": {"title": "Where is my bag?", "text": "SITA provides IT for airports and counts bags that are delayed, lost or damaged. In 2024, <b>33.4 million<\/b> bags were mishandled: <b>6.3 for every 1,000 passengers<\/b>. Every checked bag has a tag number. To return a lost bag, a computer must find one tag number in a very long list.", "img": "l23", "question": "How long can it take to find one bag tag if the computer checks the list one tag at a time?"}, "opinion": "A list has 1,000,000 tags. How many checks in the worst case? …", "goals": ["<b>Describe<\/b> how linear search checks items one by one until it finds the target or reaches the end.", "<b>Construct<\/b> pseudocode that matches a flowchart for linear search.", "<b>Calculate<\/b> the number of checks in the best case and the worst case."], "key": ["Check each item <b>in order<\/b> from index 0 until you find the target (return its index) or reach the end (return <b>−1<\/b>).", "<b>Best case<\/b>: target first → 1 check. <b>Worst case<\/b>: target last or missing → n checks. Works on <b>unsorted<\/b> data."], "warn": null, "extra": null, "blocks": [{"k": "L19a", "title": "Linear search for a bag tag", "predict": "Two outputs:", "note": null, "norun": false, "code": ["bag_tags = [4821, 1377, 9054, 2210, 6689, 3302, 7745, 5518]", "", "def linear_search(items, target):", "    for i in range(len(items)):", "        if items[i] == target:", "            return i", "    return -1", "", "print(linear_search(bag_tags, 6689))", "print(linear_search(bag_tags, 1000))"], "notes": ["8 tags, <b>not<\/b> sorted", "", "", "check index 0, 1, 2 … in order", "", "found → stop at once and give the index", "only after checking 89))\nprint(linear_search(bag_tags, 1000))", "def linear_search_watch(items, target):\n    checks = 0\n    for i in range(len(items)):\n        checks = checks + 1\n        found = items[i] == target\n        print(items[i], found)\n        if found:\n            break\n    print(checks, \"checks\")\n\nlinear_search_watch(bag_tags, 6689)"]}], "tasks": [{"label": "Task 1", "title": "Count the checks", "min": 6, "text": "Use <code>bag_tags<\/code> (8 tags). Write what linear search returns and how many checks it makes. Then fill the last two rows.", "parts": [{"type": "table", "id": "L19.t0.p0", "head": ["Target", "Returns", "Checks"], "rows": [["4821", "", ""], ["5518", "", ""], ["1000", "", ""], ["worst case, n = 1,000,000", "—", ""], ["worst case, n = 2,000,000", "—", ""]], "w": [44, 26, 30], "center": false, "nohead": false, "tall": false}], "success": "the missing tag needs as many checks as there are tags."}, {"label": "Task 2", "title": "From flowchart to pseudocode", "min": 8, "text": "Write pseudocode that matches this flowchart. Use FUNCTION, SET … TO, WHILE … DO, IF … THEN and RETURN.", "parts": [{"type": "img", "src": "l19", "w": 52, "caption": null}, {"type": "pseudo", "id": "L19.t1.p1", "n": 9}], "success": "every box has a matching line; indents show what is inside the loop and the IF."}], "summative": ["B", "Summative B: a <b>search for one value in unsorted data<\/b>, written as a flowchart or pseudocode with a “found” output and a <b>−1 “not found”<\/b> output, plus its best and worst case."], "back": "Use your numbers from Task 1 and L19c. Why could linear search be too slow for millions of bags searched again and again?", "exit": ["An unsorted list has 50 names. How many checks in the worst case?", "Give one advantage of linear search."], "soi": "process", "hexagons": null}, {"n": 20, "kind": "lesson", "week": 7, "date": "2026-11-25", "crit": "B", "title": "Binary search: logic of searching sorted data", "iq": "How can the efficiency of an algorithm be measured and compared?", "atl": [["Thinking skills", "Identify the pattern between halving and log2: each doubling of n adds only one check"], ["Social skills", "Facilitate group discussion in the “guess my page” game"]], "warm": "“Guess my page” in pairs (1–21,730): your partner answers “higher” or “lower” and counts your guesses.", "case": {"title": "291,500 words in 20 volumes", "text": "The Oxford English Dictionary (2nd edition, 1989) fills <b>20 volumes<\/b> and explains <b>291,500<\/b> entries. Nobody reads from page 1 to find a word. You open it near the middle and throw away the half you do not need. This works only because the entries are in <b>alphabetical order<\/b>.", "img": "l20", "question": "How can we find one entry among 291,500 in only a few steps, and why must the entries be sorted?"}, "opinion": "“Guess my page”: how many guesses at most for 21,730 pages? …", "goals": ["<b>Describe<\/b> how binary search halves the part of a sorted list that is still searched.", "<b>Construct<\/b> a trace of low, middle and high.", "<b>Calculate<\/b> the worst-case number of checks with log2(n) and compare it with linear search."], "key": ["Only for <b>sorted<\/b> data. Look at the middle: <code>middle = (low + high) // 2<\/code>. Found → return it. Too small → <code>low = middle + 1<\/code>. Too big → <code>high = middle - 1<\/code>.", "Each check <b>halves<\/b> what is left. Worst case: floor(log2 n) + 1 checks. When n doubles → only <b>+1<\/b> check.", "Worked example — “owl” in 15 sorted animal names: middle 7 “hen” → right · 11 “lion” → right · 13 “newt” → right · 14 “owl” found (4 checks)."], "warn": "Binary search on an <b>unsorted<\/b> list gives wrong answers: <code>[30, 10, 50, 20, 40]<\/code>, search for 10 → returns −1 although 10 is there!", "extra": null, "blocks": [{"k": "L20a", "title": "Binary search in Python", "predict": "Two outputs:", "note": null, "norun": false, "code": ["pages = [120, 845, 1302, 2210, 3977, 5120, 6630, 8045, 9311, 11002, 12450, 14876, 16230, 19904, 21730]", "", "def binary_search(items, target):", "    low = 0", "    high = len(items) - 1", "    while low <= high:", "        middle = (low + high) // 2", "        if items[middle] == target:", "            return middle", "        elif items[middle] < target:", "            low = middle + 1", "        else:", "            high = middle - 1", "    return -1", "", "print(binary_search(pages, 12450))", "print(binary_search(pages, 5000))"], "notes": ["must be <b>sorted<\/b>!", "", "", "left edge of the part still searched", "right edge", "stop when nothing is left", "<code>//<\/code> divides and rounds <b>down<\/b>", "", "found", "the target is bigger …", "… throw away the <b>left<\/b> half", "", "throw away the <b>right<\/b> half", "low > high: not found", "", "", ""], "output": "10\n-1", "setup": []}, {"k": "L20b", "title": "Worst-case checks for bigger lists", "predict": "Checks for 291,500 entries:", "note": null, "norun": false, "code": ["import math", "for n in [10, 100, 1000, 21730, 291500, 1000000]:", "    halvings = math.log2(n)", "    worst_checks = math.floor(halvings) + 1", "    print(n, worst_checks, round(halvings, 1))"], "notes": ["the math module", "", "how many times n can be halved", "round down, then + 1", ""], "output": "10 4 3.3\n100 7 6.6\n1000 10 10.0\n21730 15 14.4\n291500 19 18.2\n1000000 20 19.9", "setup": ["pages = [120, 845, 1302, 2210, 3977, 5120, 6630, 8045, 9311, 11002, 12450, 14876, 16230, 19904, 21730]\n\ndef binary_search(items, target):\n    low = 0\n    high = len(items) - 1\n    while low <= high:\n        middle = (low + high) // 2\n        if items[middle] == target:\n            return middle\n        elif items[middle] < target:\n            low = middle + 1\n        else:\n            high = middle - 1\n    return -1\n\nprint(binary_search(pages, 12450))\nprint(binary_search(pages, 5000))"]}], "tasks": [{"label": "Task 1", "title": "Trace binary search", "min": 8, "text": "Use <code>pages<\/c s<\/th><\/tr><tr><td>Linear search<\/td><td>n<\/td><\/tr><tr><td>Binary search<\/td><td>k + 1, where 2<sup>k<\/sup> ≤ n &lt; 2<sup>k+1<\/sup> (e.g. n = 100: 2<sup>6<\/sup> = 64 ≤ 100 &lt; 128, so 7)<\/td><\/tr><tr><td>Bubble or selection sort<\/td><td>n(n − 1) ÷ 2<\/td><\/tr><\/table><p class=\"small\">Formulas you may use. Powers of 2: 2<sup>8<\/sup> = 256, 2<sup>9<\/sup> = 512, 2<sup>26<\/sup> = 67,108,864, 2<sup>27<\/sup> = 134,217,728, 2<sup>28<\/sup> = 268,435,456.<\/p>", "tasks": [{"label": "Task 1", "title": "Select and justify", "min": 12, "text": "For each scenario choose linear or binary search, and say whether the data must be sorted first. Justify each choice with at least two facts from the scenario.", "parts": [{"type": "table", "head": ["Scenario", "Search", "Sort first? (yes/no)", "Justification"], "w": [30, 13, 13, 44], "tall": true, "rows": [["A. A list of 30 students in the order they arrived. You look for one name, once.", "", "", ""], ["B. A catalogue of 129,864,880 book IDs, already in order, searched millions of times a day.", "", "", ""], ["C. 500 quiz scores in random order. Players search for their score about 1,000 times a day.", "", "", ""]], "id": "L21.t0.p0"}], "success": "3 complete rows; each justification mentions the size of the data and whether it is sorted."}, {"label": "Task 2", "title": "Justify with numbers", "min": 10, "text": "Use the formulas above. Show your working.", "parts": [{"type": "table", "head": ["Question", "Number", "Working"], "w": [40, 18, 42], "rows": [["B: linear search, worst case", "", ""], ["B: binary search, worst case", "", ""], ["B: binary search if the catalogue doubled", "", ""], ["C: 1,000 linear searches, worst case", "", ""], ["C: sort once + 1,000 binary searches", "", ""]], "id": "L21.t1.p0"}], "success": "correct numbers with working for every row."}, {"label": "Task 3", "title": "Organize the logic", "min": 12, "text": "Write pseudocode for the search you chose for scenario C. Use the Lesson 13 ", "img": "l22", "question": "How can a process that is fast for 100 items become a disaster for 63,000 items?"}, "opinion": "“Twice as much data always means twice as much time.” Agree / Disagree, because …", "goals": ["<b>State<\/b> the Big O of a process: O(1), O(log n), O(n) or O(n²).", "<b>Use<\/b> a step counter to measure how the steps grow when n doubles.", "<b>Explain<\/b> why a loop inside a loop made GTA Online load slowly."], "key": ["<b>O(1)<\/b> no loop · <b>O(log n)<\/b> halving: n doubles → <b>+1<\/b> step · <b>O(n)<\/b> one loop: n doubles → <b>× 2<\/b> · <b>O(n²)<\/b> loop inside a loop: n doubles → <b>× 4<\/b>.", "<b>Doubling test<\/b>: ratio = steps for 2n ÷ steps for n. About 1 → O(log n) · about 2 → O(n) · about 4 → O(n²)."], "warn": null, "extra": null, "blocks": [{"k": "L22a", "title": "Counting the steps of linear search", "predict": "Steps for 2000:", "note": null, "norun": false, "code": ["def linear_steps(n):", "    items = list(range(n))", "    steps = 0", "    for item in items:          # worst case: target -1 is never found", "        steps = steps + 1", "        if item == -1:", "            break", "    return steps", "", "for n in [1000, 2000, 4000]:", "    print(n, linear_steps(n))"], "notes": ["", "", "", "worst case: −1 is never found", "count one check", "", "", "", "", "the <b>doubling test<\/b>", ""], "output": "1000 1000\n2000 2000\n4000 4000", "setup": []}, {"k": "L22b", "title": "Counting the steps of binary search", "predict": "Steps for 2000:", "note": null, "norun": false, "code": ["def binary_steps(n):", "    items = list(range(n))", "    low, high, steps = 0, n - 1, 0", "    while low <= high:", "        steps = steps + 1", "        middle = (low + high) // 2", "        if items[middle] == -1:", "            break", "        elif items[middle] < -1:", "            low = middle + 1", "        else:", "            high = middle - 1", "    return steps", "", "for n in [1000, 2000, 4000]:", "    print(n, binary_steps(n))"], "notes": ["", "", "three variables in one line", "", "count one check (= one halving)", "", "", "", "", "", "", "", "", "", "the doubling test", ""], "output": "1000 9\n2000 10\n4000 11", "setup": ["def linear_steps(n):\n    items = list(range(n))\n    steps = 0\n    for item in items:          # worst case: target -1 is never found\n        steps = steps + 1\n        if item == -1:\n            break\n    return steps\n\nfor n in [1000, 2000, 4000]:\n    print(n, linear_steps(n))"]}, {"k": "L22c", "title": "A loop inside a loop (the GTA duplicate check)", "predict": "Steps for 1000:", "note": null, "norun": false, "code": ["def gta_steps(n):                 # for each item, search every item kept before it", "    steps = 0", "    for i in range(n):", "        for j in range(i):", "            steps = steps + 1", "    return steps", "", "for n in [1000, 2000, 4000]:", "    print(n, gta_steps(n))"], "notes": ["each item is compared with every item kept before it", "", "outer loop: each new item", "inner loop: every earlier item → <b>a loop inside a loop<\/b>", "count one comparison", "", "", "the doubling test", ""], "output": "1000 499500\n2000 1999000\n4000 7998000", "setup": ["def linear_steps(n):\n    items = list(range(n))\n    steps = 0\n    for item in items:          # worst case: target -1 is never found\n        steps = steps + 1\n        if item == -1:\n            break\n    return steps\n\nfor n in [1000, 2000, 4000]:\n    print(n, linear_steps(n))", "def binary_steps(n):\n    items = list(range(n))\n    low, high, steps = 0, n - 1, 0\n    while low <= high:\n        steps = steps + 1\n        middle = (low + high) // 2\n        if items[middle] == -1:\n            break\n        elif items[middle] < -1:\n            low = middle + 1\n        else:\n            high = middle - 1\n    return steps\n\nfor n in [1000, 2000, 4000]:\n    print(n, binary_steps(n))"]}], "tasks": [{"label": "Task 1", "title": "The doubling test", "min": 8, "text": "Use the outputs above. Ratio = steps for 2000 ÷ steps for 1000 (2 decimal places).", "parts": [{"type": "table", "id": "L22.t0.p0", "head": ["Process", "Steps n = 1000", "Steps n = 2000", "Ratio", "Big O"], "rows": [["Linear search", "", "", "", ""], ["Binary search", "", "", "", ""], ["GTA loop", "", "", "", ""]], "w": [24, 19, 19, 16, 22], "center": true, "nohead": false, "tall": false}], "success": "your ratios are about 2, about 1 and about 4, and each Big O matches the key box."}, {"label": "Task 2", "title": "Spot the Big O", "min": 6, "text": "Give the worst-case Big O and a short reason: no loop / one loop / loop inside a loop / halving.", "parts": [{"type": "table", "id": "L22.t1.p0", "head": ["Process", "Big O", "Reason"], "rows": [["Bubble sort", "", ""], ["Linear search", "", ""], ["Binary search", "", ""], ["Show the first song of a playlist", "", ""]], "w": [36, 16, 48], "center": false, "nohead": false, "tall": false}], "success": "each reason names no loop, one loop, a loop inside a loop, or halving."}], "summative": ["C", "In Summative C you calculate the <b>ratio when n doubles<\/b> from your own measurements and compare it with Big O: about 4 for your sort, about 2 for linear search."], "back": "Use the words <b>loop inside a loop<\/b> and <b>O(n²)<\/b>. What would happen to the comparisons with <b>126,000<\/b> items?", "exit": ["What is the worst-case Big O of linear search?", "An O(n²) sort takes 2 seconds for 1000 items. Estimate the time for 2000 items."], "soi": "measurement", "hexagons": null}, {"n": 23, "kind": "lesson", "week": 8, "date": "2026-12-02", "crit": "C", "title": "Measurement of best/worst cases and runtime performance", "iq": "How can measurement help us select appropriate data structures and algorithms for different problems?", "atl": [["Research skills", "Use an organized process to measure runtime fairly (same n, different input order)"], ["Thinking skills", "Identify the relationship between the order of the input data and the runtime"]], "warm": "In pairs, insertion-sort 6 cards: first an ordered hand, then a reversed hand. Count the moves (0 vs 15).", "case": {"title": "Cloudflare: 27 minutes of worst case", "text": "On <b>2 July 2019<\/b> Cloudflare, a company that protects and speeds up websites, sent out one new firewall rule. For most text the rule was fast, but for some text it had to try a huge number of possible matches — its <b>worst case<\/b>. Server CPUs jumped to nearly <b>100%<\/b> and traffic dropped by up to <b>82%<\/b>. The outage lasted <b>27 minutes<\/b>.", "img": "l23b", "question": "Why must engineers measure the worst case of an algorithm, not only the usual case?"}, "opinion": "“The order of the data does not change how long a sort takes.” Agree / Disagree, because …", "goals": ["<b>Distinguish<\/b> between the best case, the worst case and the average case.", "<b>Use<\/b> <code>time.perf_counter()<\/code> and a step counter to measure an algorithm with different inputs.", "<b>Justify<\/b> why engineers test the worst case, using the Cloudflare outage as evidence."], "key": ["<b>Best case<\/b> lets the algorithm stop early · <b>worst case<\/b> makes it do the most work · <b>average case<\/b> = a typical (random) input.", "Timing: <code>start = time.perf_counter()<\/code> → run → <code>seconds = time.perf_counter() - start<\/code>.", "<b>Fair test<\/b>: same n, change <b>only<\/b> the input order, repeat each run. Times differ on every computer — compare the <b>pattern<\/b>."], "warn": null, "extra": null, "blocks": [{"k": "L23a", "title": "Timing the best and worst case of linear search", "predict": "Which is slower, and about how much?", "note": null, "norun": false, "code": ["import time", "def linear_search(items, target):", "    for i in range(len(items)):", "        if items[i] == target:", "            return i", "    return -1", "", "data = list(range(1000000))", "for name, target in [(\"best case\", 0), (\"worst case\", -1)]:", "    start = time.perf_counter()", "    linear_search(data, target)", "    seconds = time.perf_counter() - start", "    print(name, round(seconds, 4), \"s\")"], "notes": ["", "linear search from Lesson 19", "", "", "", "", "", "the same n for both tests", "two inputs: first item / missing item", "start the stopwatch", "", "", ""], "output": "best case 0.0 s\nworst case 0.0287 s\n(times differ on every computer — compare the pattern, not the seconds)", "setup": []}, {"k": "L23b", "title": "Insertion sort: same n, three different inputs", "predict": "Steps for the sorted list:", "note": null, "norun": false, "code": ["import random", "def insertion_steps(items):", "    steps = 0", "    for i in range(1, len(items)):", "        current = items[i]", "        j = i - 1", "        while True:", "            steps = steps + 1            # count every check of the loop", "            if j >= 0 and items[j] > current:", "                items[j + 1] = items[j]", "                j = j - 1", "            else:", "                break", "        items[j + 1] = current", "    return steps", "", "n = 1000", "random.seed(1)", "random_list = [random.randint(1, 1000000) for k in range(n)]", "print(\"sorted:\", insertion_steps(list(range(n))))", "print(\"random:\", insertion_steps(random_list))", "print(\"reversed:\", insertion_steps(list(range(n, 0, -1))))"], "notes": ["", "", "", "", "", "", "repeat until <code>break<\/code>", "count <b>every<\/b> check of the loop", "bigger card on the left?", "shift right", "", "", "stop this card", "drop the card into the gap", "", "", "the <b>same n<\/b> for every test = a fair test", "the same “random” numbers on every computer", "", "best case", "average case", "worst case"], "output": "sorted: 999\nrandom: 252393\nreversed: 500499", "setup": []}], "tasks": [{"label": "Task 1", "title": "Best and worst cases", "min": 7, "text": "Complete the table. Which input lets the algorithm stop early? Which makes it do the most work?", "parts": [{"type": "table", "id": "L23.t0.p0", "head": ["Algorithm", "Best-case input", "Big O", "Worst-case input", "Big O"], "rows": [["Linear search", "target is the first item", "O(1)", "target is not in the list", "O(n)"], ["Insertion sort", "already sorted list", "O(n)", "reversed list", "O(n²)"], ["Binary search", "", "", "", ""], ["Bubble sort (Lesson 14 code)", "", "", "", ""]], "w": [24, 25, 11, 27, 13], "center": false, "nohead": false, "tall": false}], "success": "every row has an input for each case and a Big O."}, {"label": "Task 2", "title": "Plan a fair test", "min": 7, "text": "A classmate says: “I tested my insertion sort with a sorted list of 3000 numbers. It took 0.001 s, so it is fast.” What is wrong? Describe a better test.", "parts": [{"type": "text", "id": "L23.t1.p0", "n": 5}], "success": "you use the words best case and worst case and name the inputs you would add."}], "summative": ["C", "Summative C Experiment 2 runs your sort on <b>three arrangements<\/b> (nearly reverse, random, sorted) with the <b>same n<\/b> — today’s fair test. Use a fresh copy, 3 runs and the average."], "back": "How was the Cloudflare rule like insertion sort with a reversed list? Use <b>100%<\/b> and <b>27 minutes<\/b>.", "exit": ["What is the best-case input for linear search?", "Give one reason why your times are different from your partner’s times."], "soi": "measurement", "hexagons": null}, {"week": 8, "crit": "C", "title": "Formative assessment 4 — measuring and interpreting algorithm solutions", "iq": "How can the efficiency of an algorithm be measured and compared?", "atl": [["Research skills", "Use an organized process: measure 5 sizes, repeat 3 times, tabulate, graph, interpret"], ["Thinking skills", "Identify the trend in measured data and connect it to Big O"]], "case": {"title": "Spotify: one song in over 100 million", "text": "Spotify says its catalogue has over 100 million tracks. Each search must feel instant. Engineers do not guess whether an algorithm is fast enough: they measure it for growing n and compare the results with Big O. Today you measure linear search, one check at a time.", "question": "How can measurement show whether linear search is still fast enough when n becomes huge?"}, "goals": ["<b>Use<\/b> a given timing program to measure linear search for 5 dataset sizes.", "<b>Construct<\/b> a results table and a labelled line graph.", "<b>Interpret<\/b> my results with ratios and compare them with Big O."], "conditions": ["Individual work, 40 minutes, in this online editor.", "Type the timing program exactly as given; only fill the blanks of the measurement loop. Pasting is switched off.", "Use your own times. They will differ from other students' times — that is normal (Python in the browser is slower than IDLE)."], "plan": [[3, "Read the context, the rubric and the tasks"], [6, "Type the program; check the check line"], [8, "Run the measurement loop; Task 1"], [8, "Task 2: graph"], [12, "Task 3: interpret"], [3, "Checklist and self-assessment"]], "rubric": {"head": ["Level", "C(i) Interpret and justify (Task 3)", "C(ii) Technical skills (Tasks 1–2)"], "rows": [["0", "Nothing yet that matches the descriptors below.", "Nothing yet that matches the descriptors below."], ["1–2", "You state some results (“it got slower”).", "The program runs only with help; the table is incomplete."], ["3–4", "You describe the trend in a simple way, without ratios.", "Table mostly complete; graph present but missing labels or units."], ["5–6", "You calculate ratios and explain them with O(n).", "Complete table with units and averages; labelled graph."], ["7–8", "You interpret ratios accurately, justify the differences from O(n), and use your data for the Spotify question.", "Accurate table, averages and ratios; well-labelled graph with a point for every size."]]}, "given": {"code": ["import time", "import random", "def make_data(n):", "    random.seed(1)", "    data = []", "    for item_number in range(n):", "        random_value = random.randint(1, 1000000)", "        data.append(random_value)", "    return data", "def linear_search(items, target):", "    for i in range(len(items)):", "        found = items[i] == target", "        if found:", "            return i", "    return -1", "def time_search(n):", "    data = make_data(n)", "    start = time.perf_counter()", "    linear_search(data, -1)", "    end = time.perf_counter()", "    seconds = end - start", "    return seconds", "print(make_data(5))"], "notes": ["The stopwatch: <code>time.perf_counter()<\/code>.", "For random test data.", "Builds a list of n random whole numbers.", "Seed 1: the same numbers on every computer.", "", "", "", "", "", "Linear search from Lesson 19.", "", "", "", "", "", "Times ONE worst-case search in a list of n numbers.", "The data is built before the stopwatch starts.", "", "−1 is never in the data, so every item is checked (worst case).", "", "", "", "Check line: your 5 numbers must match the expected output."], "expected": "[140892, 596854, 888599, 841236, 800876]"}, "tasks": [{"label": "Program", "title": "Type the given program, then complete the measurement loop", "min": 14, "text": "Type the given program above the measurement loop (do not change it). Fill the three blanks: each size is double the one before. Run it — the measurement takes about a minute.", "parts": [{"type": "code", "n": 30, "nopaste": true, "timeout": 240, "starter": "# type the given program here\n\n\nsizes = [100000, 200000, ____, ____, ____]\nfor n in sizes:\n    run_1 = time_search(n)\n    run_2 = time_search(n)\n    run_3 = time_search(n)\n    print(n, round(run_1, 4), round(run_2, 4), round(run_3, 4))\n", "test": {"cases": [{"expect": ["[140892, 596854, 888599, 841236, 800876]", "1600000 "], "msg": "The check line must print the 5 expected numbers, and the loop must measure 100000, 200000, 400000, 800000 and 1600000."}]}, "id": "L24.t0.p0"}]}, {"label": "Task 1", "title": "Results table", "min": 8, "text": "Copy your three runs. Average = (run 1 + run 2 + run 3) ÷ 3 , "date": "2026-12-11", "crit": "C", "title": "Summative criterion C — measurement and interpretation of solutions", "where": "Summative C paper, Part ii", "ready": ["time a function fairly: fresh copy, 3 runs, average (L23)", "calculate the ratio when n doubles and compare it with Big O (L22, L28)", "present a table and a labelled line graph (L24)", "justify results that do not fit the pattern (small n, other programs, timer)"], "bring": "your Lesson 26 file, your FA4 feedback.", "link": "Today you <b>measure and interpret<\/b> — strand C(i).", "q": "Did my measurements match Big O? What surprised me?"}, {"n": 28, "kind": "lesson", "week": 10, "date": "2026-12-14", "crit": "C", "title": "Comparing theoretical and experimental measurement", "iq": "How can the efficiency of an algorithm be measured and compared?", "atl": [["Research skills", "Use an organized process: predict steps (theory), measure time (experiment), compare"], ["Thinking skills", "Identify the pattern in the ratios when n doubles and connect it to Big O"]], "warm": null, "case": {"title": "Frontier: the fastest computer… and the same Big O", "text": "In June 2022 Frontier in the USA became the world’s fastest supercomputer — the first officially measured at more than one exaflop (<b>1.102 exaflops<\/b>). In June 2026 LineShine in China reached <b>2.198 exaflops<\/b> — about twice as fast. But on any computer, when you double the items for bubble sort, the work still grows about <b>4 times<\/b>.", "img": "l28", "question": "If a computer becomes twice as fast, does a slow algorithm become a good algorithm?"}, "opinion": "“Big O comes from the logic, not from the hardware.” Agree / Disagree, because …", "goals": ["<b>Distinguish<\/b> between theoretical measurement (counting steps) and experimental measurement (timing).", "<b>Calculate<\/b> the step ratio and the time ratio when n doubles, and compare them.", "<b>Explain<\/b> why a faster computer does not change the Big O of an algorithm."], "key": ["<b>Theory<\/b> = count the steps with a formula (bubble sort: n × (n − 1) ÷ 2) — the same on every computer.", "<b>Experiment<\/b> = measure the time — different on every computer and every run.", "A faster computer divides the <b>time<\/b> by a constant. A better algorithm changes <b>how the steps grow<\/b>."], "warn": "“Just buy a faster computer” does not fix O(n²): double the data and the work is still about 4 times bigger.", "extra": null, "blocks": [{"k": "L28a", "title": "Bubble sort with a step counter", "predict": null, "note": "Why is <code>steps = steps + 1<\/code> inside the inner loop?", "norun": false, "code": ["def bubble_steps(items):", "    steps = 0", "    n = len(items)", "    for pass_number in range(n - 1):", "        for i in range(n - 1 - pass_number):", "            steps = steps + 1           # one comparison", "            if items[i] > items[i + 1]:", "                items[i], items[i + 1] = items[i + 1], items[i]", "    return steps"], "notes": ["", "", "", "", "", "one comparison = one step (<b>theory<\/b>)", "", "", ""], "output": "(no output — definitions only)", "setup": []}, {"k": "L28b", "title": "Theory and experiment in one run", "predict": "Steps for n = 1000 (use the formula):", "note": null, "norun": false, "code": ["import random, time", "random.seed(1)", "for n in [500, 1000, 2000]:", "    data = [random.randint(1, 1000000) for k in range(n)]", "    start = time.perf_counter()", "    steps = bubble_steps(data)", "    seconds = time.perf_counter() - start", "    print(n, \"formula:\", n * (n - 1) // 2, \"steps:\", steps, \"time:\", round(seconds, 4), \"s\")"], "notes": ["", "the same random numbers on every computer", "each n doubles", "", "stopwatch on", "count the steps", "stopwatch off", "<b>theory<\/b> (formula) next to <b>experiment<\/b> (steps, time)"], "output": "500 formula: 124750 steps: 124750 time: 0.0099 s\n1000 formula: 499500 steps: 499500 time: 0.0416 s\n2000 formula: 1999000 steps: 1999000 time: 0.1704 s\n(times differ on every computer — compare the pattern, not the seconds)", "setup": ["def bubble_steps(items):\n    steps = 0\n    n = len(items)\n    for pass_number in range(n - 1):\n        for i in range(n - 1 - pass_number):\n            steps = steps + 1           # one comparison\n            if items[i] > items[i + 1]:\n                items[i], items[i + 1] = items[i + 1], items[i]\n    return steps"]}, {"k": "L28c", "title": "A better algorithm vs a faster computer", "predict": "About how many times fewer steps?", "note": null, "norun": false, "code": ["import math", "n = 1000000", "bubble = n * (n - 1) // 2               # O(n²)", "better = round(n * math.log2(n))        # O(n log n)", "print(bubble)", "print(better)", "print(round(bubble / better))           # how many times fewer steps"], "notes": ["", "one million records", "O(n²) steps", "O(n log n) steps (a better sort, e.g. merge sort)", "", "", "how many times fewer steps"], "output": "499999500000\n19931569\n25086", "setup": ["def bubble_steps(items):\n    steps = 0\n    n = len(items)\n    for pass_number in range(n - 1):\n        for i in range(n - 1 - pass_number):\n            steps = steps + 1           # one comparison\n            if items[i] > items[i + 1]:\n                items[i], items[i + 1] = items[i + 1], items[i]\n    return steps"]}], "tasks": [{"label": "Task 1", "title": "Theory vs experiment table", "min": 8, "text": "Copy the results of L28b. Fill the formula column by hand. Ratio = this row ÷ the row above.", "parts": [{"type": "table", "id": "L28.t0.p0", "head": ["n", "Formula n(n−1)÷2", "Steps (program)", "Step ratio", "Time (s)", "Time ratio"], "rows": [["500", "", "", "—", "", "—"], ["1000", "", "", "", "", ""], ["2000", "", "", "", "", ""]], "w": [10, 20, 20, 16, 18, 16], "center": true, "nohead": false, "tall": false}], "success": "the formula column equals the steps column; the step ratio is about 4; the time ratio is not exactly 4."}, {"label": "Task 2", "title": "“Just te existed — was it a “solution”? Yes / No, because …", "goals": ["<b>Identify<\/b> five criteria: correctness, efficiency, simplicity, scalability and cost.", "<b>Evaluate<\/b> two solutions to the same problem with an evaluation grid and evidence.", "<b>Justify<\/b> a position on whether efficiency should be more important than simplicity."], "key": ["<b>Correctness<\/b> right answer · <b>Efficiency<\/b> steps/time · <b>Simplicity<\/b> easy to read, test and change · <b>Scalability<\/b> still works when users grow · <b>Cost<\/b> time and money.", "No evidence → no judgement: every score needs a <b>number or a fact<\/b>."], "warn": null, "extra": null, "blocks": [{"k": "L29a", "title": "Evidence: efficiency vs simplicity", "predict": "Worst-case comparisons for B:", "note": null, "norun": false, "code": ["import math", "users = 250000", "", "# Solution A: linear search (6 lines of code)", "linear_worst = users", "# Solution B: binary search on a sorted list (13 lines of code)", "binary_worst = math.floor(math.log2(users)) + 1", "", "print(\"A linear search, worst case:\", linear_worst)", "print(\"B binary search, worst case:\", binary_worst)", "print(\"B needs\", round(linear_worst / binary_worst), \"times fewer comparisons\")"], "notes": ["", "the number of users on the first day", "", "", "linear search: worst case = n", "", "binary search: floor(log2 n) + 1", "", "", "", ""], "output": "A linear search, worst case: 250000\nB binary search, worst case: 18\nB needs 13889 times fewer comparisons", "setup": []}], "tasks": [{"label": "Task 1", "title": "Evaluation grid", "min": 8, "text": "Score each solution from 1 (weak) to 5 (strong) with evidence. A = linear search, B = binary search on a sorted list, for 250,000 users.", "parts": [{"type": "table", "id": "L29.t0.p0", "head": ["Criterion", "A", "Evidence for A", "B", "Evidence for B"], "rows": [["Correctness", "", "", "", ""], ["Efficiency", "", "", "", ""], ["Simplicity", "", "", "", ""], ["Scalability", "", "", re optimization is the root of all evil”", "text": "In December 1974 the computer scientist Donald Knuth wrote: “We should forget about small efficiencies, say about <b>97%<\/b> of the time: premature optimization is the root of all evil. Yet we should not pass up our opportunities in that critical <b>3%<\/b>.” Programmers still quote this sentence today. It sums up our whole unit.", "img": null, "question": "When should we make a solution faster, and when is a simple, correct solution good enough?"}, "opinion": "What does “premature” mean here? …", "goals": ["<b>Identify<\/b> connections between the cases and concepts of this unit.", "<b>Evaluate<\/b> Knuth’s advice and the question “Is the most efficient algorithm always the best solution?”.", "<b>Justify<\/b> my answer to the statement of inquiry with evidence from two cases."], "key": ["<b>Hexagonal thinking<\/b>: two hexagons may touch only if you can say <b>because<\/b> + a fact or number.", "Example: GTA Online touches MEASUREMENT <b>because<\/b> counting about 1.98 billion comparisons showed the slow part.", "The <b>facilitator<\/b> makes sure everyone places hexagons and asks “why do these touch?”."], "warn": null, "extra": null, "blocks": [], "tasks": [{"label": "Task 1", "title": "Record your connections", "min": 6, "text": "Choose your 3 best touching sides from your group’s map. Row 1 is an example.", "parts": [{"type": "table", "id": "L30.t0.p0", "head": ["Hexagon 1", "Hexagon 2", "They touch because …"], "rows": [["GTA Online", "MEASUREMENT", "counting the comparisons (about 1.98 billion) showed the slow part; the fix cut loading from 6 min to 1 min 50 s."], ["", "", ""], ["", "", ""], ["", "", ""]], "w": [22, 22, 56], "center": false, "nohead": false, "tall": true}], "success": "each connection uses “because” and a fact or number from the case."}, {"label": "Task 2", "title": "Knuth and the debatable question", "min": 8, "text": "<b>Is the most efficient algorithm always the best solution?<\/b> Write
