<script>
const COURSE = JSON.parse(document.getElementById('course').textContent);
// ======================================================================= backend (Firebase or local demo)
const lc = s => (s || '').trim().toLowerCase();
const isTeacherEmail = e => CONFIG.teachers.map(lc).includes(lc(e));

function makeEmitter() {
  const subs = new Set();
  return { on(f) { subs.add(f); return () => subs.delete(f); }, emit(v) { subs.forEach(f => { try { f(v); } catch (e) { console.error(e); } }); } };
}

// ----------------------------------------------------------------------- demo backend (browser storage)
function DemoBackend() {
  const KEY = 'dsa_course_demo_v1';
  let mem = null;
  const load = () => {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { mem = null; }
    if (!mem) mem = seed();
    return mem;
  };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* storage unavailable: keep in memory */ } };
  const changed = makeEmitter();
  let me = null;
  const authEm = makeEmitter();

  function seed() {
    const users = {
      's1': { uid: 's1', email: 'aigerim.b@school.kz', name: 'Aigerim Bekova', cls: '10A' },
      's2': { uid: 's2', email: 'arman.s@school.kz', name: 'Arman Sadykov', cls: '10A' },
      's3': { uid: 's3', email: 'dana.o@school.kz', name: 'Dana Omarova', cls: '10B' },
      't1': { uid: 't1', email: CONFIG.teachers[0] || 'teacher@school.kz', name: 'Teacher', cls: '' },
    };
    const progress = { s1: {}, s2: {}, s3: {} };
    const now = Date.now();
    for (let n = 1; n <= 9; n++) {
      progress.s2[n] = { n, pct: n === 6 ? 45 : 100, done: n !== 6, time: 1500 + n * 60, away: { count: n === 4 ? 2 : 0, secs: n === 4 ? 95 : 0, log: n === 4 ? [{ t: new Date(now - 864e5 * 12).toISOString(), s: 60, k: 'left page' }, { t: new Date(now - 864e5 * 12 + 6e5).toISOString(), s: 35, k: 'left page' }] : [] }, a: {} };
      if (n !== 3 && n !== 7) progress.s3[n] = { n, pct: n < 5 ? 100 : 70, done: n < 5, time: 1200, away: { count: 0, secs: 0, log: [] }, a: {} };
    }
    return { users, progress, feedback: {}, config: { schedule: {}, closed: [] }, roster: [] };
  }

  return {
    mode: 'demo',
    async init() { load(); },
    demoUsers() { const d = load(); return Object.values(d.users); },
    onAuth(cb) { authEm.on(cb); setTimeout(() => cb(me), 0); },
    async loginAs(uid) {
      const d = load(); const u = d.users[uid];
      me = { ...u, isTeacher: isTeacherEmail(u.email) || uid === 't1' };
      authEm.emit(me);
    },
    async login() { throw new Error('Demo mode: choose a demo user below.'); },
    async loginMicrosoft() { throw new Error('Demo mode.'); },
    async logout() { me = null; authEm.emit(null); },
    async changePassword() { throw new Error('Not available in demo mode.'); },
    async loadMyProgress() { const d = load(); return JSON.parse(JSON.stringify(d.progress[me.uid] || {})); },
    async saveProgress(n, doc) {
      const d = load(); d.progress[me.uid] = d.progress[me.uid] || {};
      d.progress[me.uid][n] = JSON.parse(JSON.stringify({ ...doc, updated: new Date().toISOString() }));
      persist(); changed.emit();
    },
    watchMyFeedback(cb) { const f = () => cb(JSON.parse(JSON.stringify(load().feedback[me.uid] || {}))); f(); return changed.on(f); },
    watchConfig(cb) { const f = () => cb(JSON.parse(JSON.stringify(load().config))); f(); return changed.on(f); },
    async setConfig(patch) { const d = load(); Object.assign(d.config, patch); persist(); changed.emit(); },
    heartbeat(n) { const d = load(); if (d.users[me.uid]) { d.users[me.uid].lastSeen = new Date().toISOString(); d.users[me.uid].current = n || null; persist(); } },
    // teacher
    watchUsers(cb) { const f = () => cb(Object.values(load().users).filter(u => !isTeacherEmail(u.email) && u.uid !== 't1')); f(); return changed.on(f); },
    watchAllProgress(cb) { const f = () => cb(JSON.parse(JSON.stringify(load().progress))); f(); return changed.on(f); },
    watchAllFeedback(cb) { const f = () => cb(JSON.parse(JSON.stringify(load().feedback))); f(); return changed.on(f); },
    async setFeedback(uid, n, fb) { const d = load(); d.feedback[uid] = d.feedback[uid] || {}; d.feedback[uid][n] = { ...fb, updated: new Date().toISOString() }; persist(); changed.emit(); },
    async teacherPatchProgress(uid, n, patch) { const d = load(); d.progress[uid] = d.progress[uid] || {}; d.progress[uid][n] = { ...(d.progress[uid][n] || { n }), ...patch }; persist(); changed.emit(); },
    async getRoster() { return load().roster.slice(); },
    async saveRoster(list) {
      const d = load(); d.roster = list;
      list.forEach((r, i) => {
        const exists = Object.values(d.users).find(u => lc(u.email) === lc(r.email));
        if (exists) { exists.name = r.name; exists.cls = r.cls; }
        else { const uid = 'r' + Date.now().toString(36) + i; d.users[uid] = { uid, email: r.email, name: r.name, cls: r.cls }; }
      });
      persist(); changed.emit();
    },
    async createAccounts(list) {
      const d = load(); d.passwords = d.passwords || {};
      const res = list.map(r => { const u = Object.values(d.users).find(x => lc(x.email) === lc(r.email)); const pw = genPassword(); if (u) d.passwords[u.uid] = { email: u.email, password: pw }; return { ...r, password: pw, ok: true }; });
      persist(); changed.emit(); return res;
    },
    watchPasswords(cb) { const f = () => cb(JSON.parse(JSON.stringify(load().passwords || {}))); f(); return changed.on(f); },
    async storePassword(uid, email, pw) { const d = load(); d.passwords = d.passwords || {}; d.passwords[uid] = { email, password: pw }; persist(); changed.emit(); },
    async setPassword(u, oldPw, newPw) { await this.storePassword(u.uid, u.email, newPw); },
  };
}

// ----------------------------------------------------------------------- Firebase backend
function FirebaseBackend() {
  const V = '10.12.2';
  let app, auth, db, F, A, cfgUnsub = null;
  let me = null, known = false;
  const authEm = makeEmitter();

  async function profileFor(u) {
    const email = lc(u.email || (u.providerData[0] && u.providerData[0].email));
    const ref = F.doc(db, 'users', u.uid);
    let snap = await F.getDoc(ref);
    let p = snap.exists() ? snap.data() : null;
    if (!p || !p.name) {
      let r = null;
      try { const rs = await F.getDoc(F.doc(db, 'roster', email)); if (rs.exists()) r = rs.data(); } catch (e) { /* not on roster */ }
      p = { email, name: (r && r.name) || u.displayName || email.split('@')[0], cls: (r && r.cls) || '', ...(p || {}) };
      if (r) { p.name = r.name; p.cls = r.cls; }
      try { await F.setDoc(ref, { email: p.email, name: p.name, cls: p.cls }, { merge: true }); } catch (e) { console.warn(e); }
    }
    return { uid: u.uid, email, name: p.name, cls: p.cls || '', isTeacher: isTeacherEmail(email) };
  }

  return {
    mode: 'firebase',
    async init() {
      const base = `https://www.gstatic.com/firebasejs/${V}/`;
      const appM = await import(base + 'firebase-app.js');
      A = await import(base + 'firebase-auth.js');
      F = await import(base + 'firebase-firestore.js');
      app = appM.initializeApp(CONFIG.firebase);
      this._appM = appM;
      auth = A.getAuth(app);
      db = F.getFirestore(app);
      A.onAuthStateChanged(auth, async u => {
        if (!u) { me = null; known = true; authEm.emit(null); return; }
        try { me = await profileFor(u); } catch (e) { console.error(e); me = { uid: u.uid, email: lc(u.email), name: u.email, cls: '', isTeacher: isTeacherEmail(u.email) }; }
        known = true;
        authEm.emit(me);
      });
    },
    onAuth(cb) { authEm.on(cb); if (known) cb(me); },
    async login(email, pw) { await A.signInWithEmailAndPassword(auth, email.trim(), pw); },
    async loginMicrosoft() {
      const p = new A.OAuthProvider('microsoft.com');
      const params = { prompt: 'select_account' };
      if (CONFIG.microsoftTenant) params.tenant = CONFIG.microsoftTenant;
      p.setCustomParameters(params);
      await A.signInWithPopup(auth, p);
    },
    async logout() { await A.signOut(auth); },
    async changePassword(pw) { await A.updatePassword(auth.currentUser, pw); },
    async loadMyProgress() {
      const qs = await F.getDocs(F.collection(db, 'progress', me.uid, 'lessons'));
      const out = {}; qs.forEach(d => { out[d.id] = d.data(); }); return out;
    },
    async saveProgress(n, doc) {
      await F.setDoc(F.doc(db, 'progress', me.uid, 'lessons', String(n)), { ...doc, n, updated: F.serverTimestamp() });
    },
    watchMyFeedback(cb) {
      return F.onSnapshot(F.collection(db, 'feedback', me.uid, 'items'), qs => { const o = {}; qs.forEach(d => o[d.id] = d.data()); cb(o); }, e => console.warn(e));
    },
    watchConfig(cb) {
      return F.onSnapshot(F.doc(db, 'config', 'main'), s => cb(s.exists() ? s.data() : { schedule: {}, closed: [] }), e => { console.warn(e); cb({ schedule: {}, closed: [] }); });
    },
    async setConfig(patch) { await F.setDoc(F.doc(db, 'config', 'main'), patch, { merge: true }); },
    heartbeat(n) { if (!me) return; F.setDoc(F.doc(db, 'users', me.uid), { lastSeen: F.serverTimestamp(), current: n || null }, { merge: true }).catch(() => {}); },
    watchUsers(cb) {
      return F.onSnapshot(F.collection(db, 'users'), qs => {
        const list = []; qs.forEach(d => { const u = d.data(); u.uid = d.id; if (u.lastSeen && u.lastSeen.toDate) u.lastSeen = u.lastSeen.toDate().toISOString(); if (!isTeacherEmail(u.email)) list.push(u); }); cb(list);
      }, e => console.warn(e));
    },
    watchAllProgress(cb) {
      return F.onSnapshot(F.collectionGroup(db, 'lessons'), qs => {
        const o = {}; qs.forEach(d => { const uid = d.ref.parent.parent.id; if (d.ref.parent.parent.parent.id !== 'progress') return; (o[uid] = o[uid] || {})[d.id] = d.data(); }); cb(o);
      }, e => console.warn(e));
    },
    watchAllFeedback(cb) {
      return F.onSnapshot(F.collectionGroup(db, 'items'), qs => {
        const o = {}; qs.forEach(d => { const uid = d.ref.parent.parent.id; (o[uid] = o[uid] || {})[d.id] = d.data(); }); cb(o);
      }, e => console.warn(e));
    },
    async setFeedback(uid, n, fb) { await F.setDoc(F.doc(db, 'feedback', uid, 'items', String(n)), { ...fb, updated: F.serverTimestamp() }); },
    async teacherPatchProgress(uid, n, patch) { await F.setDoc(F.doc(db, 'progress', uid, 'lessons', String(n)), patch, { merge: true }); },
    async getRoster() { const qs = await F.getDocs(F.collection(db, 'roster')); const l = []; qs.forEach(d => l.push({ email: d.id, ...d.data() })); return l; },
    async saveRoster(list) {
      const b = F.writeBatch(db);
      list.forEach(r => b.set(F.doc(db, 'roster', lc(r.email)), { name: r.name, cls: r.cls }));
      await b.commit();
    },
    async createAccounts(list) {
      const sec = this._appM.initializeApp(CONFIG.firebase, 'secondary-' + Date.now());
      const sauth = A.getAuth(sec);
      const out = [];
      for (const r of list) {
        const pw = genPassword();
        try {
          const cred = await A.createUserWithEmailAndPassword(sauth, r.email.trim(), pw);
          await F.setDoc(F.doc(db, 'users', cred.user.uid), { email: lc(r.email), name: r.name, cls: r.cls }, { merge: true });
          await F.setDoc(F.doc(db, 'passwords', cred.user.uid), { email: lc(r.email), password: pw, updated: F.serverTimestamp() });
          out.push({ ...r, password: pw, ok: true });
          await A.signOut(sauth);
        } catch (e) { out.push({ ...r, password: '', ok: false, error: e.code || e.message }); }
      }
      return out;
    },
    watchPasswords(cb) {
      return F.onSnapshot(F.collection(db, 'passwords'), qs => { const o = {}; qs.forEach(d => o[d.id] = d.data()); cb(o); }, e => { console.warn(e); cb({}); });
    },
    async storePassword(uid, email, pw) { await F.setDoc(F.doc(db, 'passwords', uid), { email: lc(email), password: pw, updated: F.serverTimestamp() }); },
    // the teacher changes a student's password: sign in as the student in a separate, hidden session with the stored password, then update it
    async setPassword(u, oldPw, newPw) {
      const sec = this._appM.initializeApp(CONFIG.firebase, 'pw-' + Date.now());
      const sauth = A.getAuth(sec);
      try {
        const cred = await A.signInWithEmailAndPassword(sauth, u.email, oldPw);
        await A.updatePassword(cred.user, newPw);
        await A.signOut(sauth);
      } finally { this._appM.deleteApp(sec).catch(() => {}); }
      await this.storePassword(u.uid, u.email, newPw);
    },
  };
}

function genPassword() {
  const a = 'abcdefghjkmnpqrstuvwxyz', d = '23456789';
  let s = '';
  const rnd = n => { const x = new Uint32Array(1); crypto.getRandomValues(x); return x[0] % n; };
  for (let i = 0; i < 5; i++) s += a[rnd(a.length)];
  for (let i = 0; i < 3; i++) s += d[rnd(d.length)];
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ======================================================================= Python in the browser (Pyodide in a Web Worker)
const WORKER_SRC = `
let py = null;
const HELPER = \`
import sys, traceback, builtins
class _Null:
    def write(self, s): return len(s)
    def flush(self): pass
def __run_student(setup_blocks, code, stdin_lines, post):
    g = {'__name__': '__main__'}
    lines = list(stdin_lines)
    def _inp(prompt=''):
        v = lines.pop(0) if lines else ''
        print(str(prompt) + v)
        return v
    g['input'] = _inp
    real = sys.stdout
    sys.stdout = _Null()
    for b in setup_blocks:
        try:
            exec(compile(b, '<setup>', 'exec'), g)
        except BaseException:
            pass
    sys.stdout = real
    try:
        exec(compile(code, '<your code>', 'exec'), g)
        if post:
            exec(compile(post, '<check>', 'exec'), g)
        return ''
    except BaseException:
        et, ev, tb = sys.exc_info()
        out = []
        for line in traceback.format_exception(et, ev, tb):
            if '<exec>' in line or '__run_student' in line or 'File "/lib/' in line:
                continue
            out.append(line)
        return ''.join(out)
\`;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      importScripts(m.url + 'pyodide.js');
      py = await loadPyodide({ indexURL: m.url });
      py.setStdout({ batched: (s) => postMessage({ type: 'out', text: s + '\\n' }) });
      py.setStderr({ batched: (s) => postMessage({ type: 'out', text: s + '\\n', err: true }) });
      py.runPython(HELPER);
      postMessage({ type: 'ready' });
    } catch (err) { postMessage({ type: 'fatal', error: String(err) }); }
    return;
  }
  if (m.type === 'run') {
    try {
      const fn = py.globals.get('__run_student');
      const err = fn(py.toPy(m.setup || []), m.code, py.toPy(m.stdin || []), m.post || '');
      fn.destroy();
      postMessage({ type: 'done', error: err || '' });
    } catch (err) { postMessage({ type: 'done', error: String(err) }); }
  }
};`;

const PY = {
  worker: null, ready: null, job: null, status: 'off',
  ensure() {
    if (this.ready) return this.ready;
    this.status = 'loading';
    this.ready = new Promise((resolve, reject) => {
      let url = CONFIG.pyodideUrl;
      if (!/^https?:/.test(url)) url = new URL(url, location.href).href;
      const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
      const w = new Worker(URL.createObjectURL(blob));
      this.worker = w;
      w.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'ready') { this.status = 'ready'; resolve(); }
        else if (m.type === 'fatal') { this.status = 'failed'; this.ready = null; reject(new Error(m.error)); }
        else if (this.job) {
          if (m.type === 'out') this.job.onOut(m.text, m.err);
          else if (m.type === 'done') { const j = this.job; this.job = null; clearTimeout(j.timer); j.resolve({ error: m.error, timedOut: false }); }
        }
      };
      w.onerror = (e) => { this.status = 'failed'; this.ready = null; reject(new Error(e.message || 'Python could not start')); };
      w.postMessage({ type: 'init', url });
    });
    return this.ready;
  },
  async run({ setup, code, stdin, post, timeout = 15, onOut }) {
    if (this.job) throw new Error('Another program is still running — press Stop first.');
    await this.ensure();
    return new Promise((resolve) => {
      const job = { resolve, onOut };
      job.timer = setTimeout(() => { this.kill(); resolve({ error: '', timedOut: true }); }, timeout * 1000);
      this.job = job;
      this.worker.postMessage({ type: 'run', setup, code, stdin, post });
    });
  },
  kill() {
    if (this.worker) this.worker.terminate();
    if (this.job) { clearTimeout(this.job.timer); const j = this.job; this.job = null; j.resolve({ error: '', timedOut: true, stopped: true }); }
    this.worker = null; this.ready = null; this.status = 'off';
  },
};

function checkCase(c, out, src) {
  const why = [];
  (c.expect || []).forEach(e => { if (!out.includes(e)) why.push('missing'); });
  (c.notExpect || []).forEach(e => { if (out.includes(e)) why.push('extra'); });
  Object.entries(c.count || {}).forEach(([k, v]) => { if (out.split(k).length - 1 !== v) why.push('count'); });
  if (c.regex && !(new RegExp(c.regex, 'm')).test(out)) why.push('regex');
  (c.srcHas || []).forEach(s => { if (!src.includes(s)) why.push('src'); });
  (c.notSrc || []).forEach(s => { if (src.includes(s)) why.push('forbidden'); });
  return why.length === 0;
}

// ======================================================================= helpers
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const H = html => el('span', { html });
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg, ms = 2600) { const t = el('div', { class: 'toast', text: msg }); document.body.append(t); setTimeout(() => t.remove(), ms); }
function confirmBox(text, okText = 'Yes', cancelText = 'Cancel') {
  return new Promise(res => {
    const m = el('div', { class: 'modal' }, el('div', { class: 'inner', style: 'max-width:460px;padding:22px' },
      el('p', { html: text }), el('div', { style: 'display:flex;gap:10px;justify-content:flex-end' },
        el('button', { class: 'btn sec', text: cancelText, onclick: () => { m.remove(); res(false); } }),
        el('button', { class: 'btn', text: okText, onclick: () => { m.remove(); res(true); } }))));
    document.body.append(m);
  });
}
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtSecs = s => s >= 60 ? Math.floor(s / 60) + ' min ' + (s % 60) + ' s' : s + ' s';
const IMGSRC = k => COURSE.img[k];
const LES = n => COURSE.course[n - 1];

// ======================================================================= app state
const S = {
  user: null, progress: {}, feedback: {}, config: { schedule: {}, closed: [] },
  cur: null,   // current lesson session
  unsub: [],
};
const dateOf = n => (S.config.schedule && S.config.schedule[n]) || LES(n).date;
const isClosed = n => (S.config.closed || []).map(String).includes(String(n));

function statusOf(n, doc) {
  doc = doc || {};
  const pct = doc.pct || 0, fin = !!(doc.done || doc.submitted);
  const past = dateOf(n) < todayISO();
  if (fin) return { key: 'done', pct, label: LES(n).kind === 'fa' ? 'Submitted' : 'Finished' };
  if (past) return { key: 'missed', pct, label: pct ? `Not finished · ${pct}%` : 'Missed — do it at home' };
  if (pct) return { key: 'prog', pct, label: `In progress · ${pct}%` };
  return { key: 'todo', pct, label: dateOf(n) === todayISO() ? 'Today' : 'Upcoming' };
}

// ======================================================================= lesson session (answers, saving, away log)
function newSession(n, doc, opts = {}) {
  doc = JSON.parse(JSON.stringify(doc || {}));
  doc.a = doc.a || {};
  doc.away = doc.away || { count: 0, secs: 0, log: [] };
  doc.time = doc.time || 0;
  return { n, doc, A: doc.a, req: new Set(), listeners: new Set(), ro: !!opts.ro, noSave: !!opts.noSave, timer: null, savedAt: null, dirty: false,
    activeStart: Date.now(), awayStart: null, faStarted: !!doc.started };
}
function setA(key, val) {
  const s = S.cur; if (!s || s.ro) return;
  s.A[key] = val; s.dirty = true;
  s.listeners.forEach(f => f(key));
  scheduleSave();
  updatePct();
}
function need(key) { if (S.cur) S.cur.req.add(key); }
function filled(key) {
  const v = S.cur.A[key];
  if (key.endsWith('#pass')) return S.cur.A[key] === true;
  if (typeof v === 'string') return v.trim().length > 0;
  if (Array.isArray(v)) return v.length > 0;
  return v != null && v !== false && v !== '';
}
function computePct() { const s = S.cur; if (!s || !s.req.size) return 0; let f = 0; s.req.forEach(k => { if (filled(k)) f++; }); return Math.round(100 * f / s.req.size); }
function updatePct() {
  const p = computePct(); const b = $('#pbar'); const t = $('#ptext');
  if (b) b.style.width = p + '%'; if (t) t.textContent = p + '% complete';
}
function scheduleSave(fast) {
  const s = S.cur; if (!s || s.ro || s.noSave) return;
  // at most one write every ~15 s while typing (keeps the free Firebase quota safe); fast = save now
  if (fast) { clearTimeout(s.timer); s.timer = setTimeout(saveNow, 50); return; }
  if (s.timer) return;
  setSaved('Changes will be saved in a few seconds…');
  s.timer = setTimeout(saveNow, CONFIG.saveEverySeconds * 1000 || 15000);
}
async function saveNow() {
  const s = S.cur; if (!s || s.ro || s.noSave) return;
  clearTimeout(s.timer); s.timer = null;
  setSaved('Saving…');
  s.doc.time = (s.doc.time || 0) + Math.round((Date.now() - s.activeStart) / 1000); s.activeStart = Date.now();
  s.doc.pct = computePct();
  try {
    await Backend.saveProgress(s.n, s.doc);
    S.progress[s.n] = JSON.parse(JSON.stringify(s.doc));
    s.dirty = false; setSaved('Saved ✓ ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    console.error(e);
    setSaved(/permission/i.test(e.code || e.message) ? 'Not saved — this lesson is closed or submitted' : 'Offline — will retry…');
    if (!/permission/i.test(e.code || e.message)) s.timer = setTimeout(saveNow, 10000);
  }
}
function setSaved(t) { const e = $('#saved'); if (e) e.textContent = t; }

// away-from-page tracking (only while a lesson is open)
function awayBegin(kind) {
  const s = S.cur; if (!s || s.ro || s.noSave || s.awayStart) return;
  s.awayStart = Date.now(); s.awayKind = kind;
}
function awayEnd() {
  const s = S.cur; if (!s || !s.awayStart) return;
  const secs = Math.round((Date.now() - s.awayStart) / 1000);
  const t = new Date(s.awayStart).toISOString(); const k = s.awayKind;
  s.awayStart = null;
  if (secs < 2) return;
  const aw = s.doc.away; aw.count++; aw.secs += secs; aw.log.push({ t, s: secs, k }); if (aw.log.length > 200) aw.log.shift();
  s.activeStart += secs * 1000;
  const note = $('#awaynote'); if (note) { note.classList.remove('hidden'); note.textContent = `You left this page ${aw.count} time(s), ${fmtSecs(aw.secs)} in total. Your teacher can see this.`; }
  scheduleSave();
}
function logEvent(k) {
  const s = S.cur; if (!s || s.ro || s.noSave) return;
  const aw = s.doc.away; aw.log.push({ t: new Date().toISOString(), s: 0, k }); if (k !== 'paste blocked') aw.count++;
  scheduleSave();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { awayBegin('left page'); if (S.cur && S.cur.dirty) saveNow(); } else if (document.hasFocus()) awayEnd(); });
window.addEventListener('blur', () => setTimeout(() => { if (!document.hasFocus()) awayBegin(document.hidden ? 'left page' : 'other window'); }, 300));
window.addEventListener('focus', () => { if (!document.hidden) awayEnd(); });
window.addEventListener('beforeunload', e => { if (S.cur && S.cur.dirty) { saveNow(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('fullscreenchange', () => {
  const s = S.cur; if (!s) return;
  const L = LES(s.n);
  if (L.kind === 'fa' && s.faStarted && !s.doc.submitted && !document.fullscreenElement) { logEvent('left full screen'); showFsBar(true); }
  if (document.fullscreenElement) showFsBar(false);
});
function showFsBar(on) {
  let b = $('#fsbar');
  if (!on) { if (b) b.remove(); return; }
  if (b) return;
  b = el('div', { class: 'fsbar', id: 'fsbar' }, 'You left full-screen mode — this was recorded for your teacher.',
    el('button', { text: 'Return to full screen', onclick: () => document.documentElement.requestFullscreen().catch(() => {}) }));
  document.body.append(b);
}

// ======================================================================= input components
function rating(key, caption) {
  const s = S.cur; need(key);
  const box = el('span', { class: 'rate' }, caption ? el('span', { class: 'cap', text: caption }) : null);
  [1, 2, 3].forEach(v => {

function autosize(t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight + 2, 34) + 'px'; }

// ----------------------------------------------------------------------- code editor + runner
function makeEditor(host, value, { readOnly, nopaste, onChange, pseudo }) {
  if (window.CodeMirror && !pseudo) {
    const cm = CodeMirror(host, { value, mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, readOnly: !!readOnly, viewportMargin: Infinity,
      extraKeys: { Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    ', 'end'), 'Shift-Tab': c => c.indentSelection('subtract') } });
    cm.on('change', () => onChange && onChange(cm.getValue()));
    if (nopaste) {
      cm.on('beforeChange', (c, ch) => { if (ch.origin === 'paste' || ch.origin === 'drop') { ch.cancel(); toast('Pasting is switched off in this assessment.'); logEvent('paste blocked'); } });
    }
    setTimeout(() => cm.refresh(), 30);
    return { get: () => cm.getValue(), set: v => cm.setValue(v) };
  }
  const t = el('textarea', { class: 'src', spellcheck: 'false', disabled: !!readOnly, rows: Math.max(4, (value || '').split('\n').length + 1) });
  t.value = value || '';
  t.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const a = t.selectionStart; t.setRangeText('    ', a, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input')); }
  });
  t.oninput = () => { onChange && onChange(t.value); t.rows = Math.max(4, t.value.split('\n').length + 1); };
  if (nopaste) blockPaste(t);
  host.append(t);
  return { get: () => t.value, set: v => { t.value = v; } };
}

function codePart(p, o = {}) {
  // p: {id, starter, setup, test, timeout, nopaste, type:'code'|'pseudo', n}

  });

  wrap.append(bar, host);

  setTimeout(() => stdinRow.classList.toggle('hidden', !usesInput()), 0);
  const print = (txt, cls) => { cons.classList.remove('hidden'); const sp = el('span', { class: cls || '' }); sp.textContent = txt; cons.append(sp); cons.scrollTop = cons.scrollHeight; };
  const btnRun = el('button', { class: 'run', type: 'button', text: '▶ Run' });

  btnReset.onclick = async () => { if (await confirmBox('Remove your code and start again?', 'Yes, reset')) { ed.set(starter); setA(key, ''); } };
  const busy = on => { btnRun.disabled = on; if (btnTest) btnTest.disabled = on; btnStop.classList.toggle('hidden', !on); };
  async function exec(post, stdin, quiet) {
    let out = '';
    const res = await PY.run({ setup: p.setup || o.setup || [], code: ed.get(), stdin, post, timeout: p.timeout || 15,
      onOut: (t, err) => { out += t; if (!quiet) print(t.replace(/__T__.*\n?/g, ''), err ? 'err' : ''); } });
    return { out, ...res };
  }
  btnRun.onclick = async () => {

    if (PY.status !== 'ready') print('Starting Python… (the first time takes a few seconds)\n', 'info');
    try {
      const stdin = stdinBox.value ? stdinBox.value.split(/[,\n]/).map(x => x.trim()) : [];
      const r = await exec('', stdin, false);
      if (r.timedOut) print(r.stopped ? '\n■ Stopped.\n' : `\n■ Stopped after ${p.timeout || 15} s — is there a loop that never ends?\n`, 'err');
      if (r.error) print('\n' + r.error, 'err');
      if (!r.error && !r.timedOut && !r.out) print('(no output)\n', 'info');
      if (!s.ro) { s.A[key + '#out'] = (r.out + (r.error ? '\n' + r.error : '')).slice(-3000); s.A[key + '#runs'] = (s.A[key + '#runs'] || 0) + 1; if (o.onRan) o.onRan(!r.error && !r.timedOut); scheduleSave(); }

  if (btnTest) btnTest.onclick = async () => {

        if (!ok) { allOk = false; msg = r.timedOut ? 'Your program did not stop in time — check your loop.' : r.error ? 'Your code stops with an error: ' + r.error.trim().split('\n').pop() : c.msg; break; }
      }

  if (s.A[key + '#out'] && s.ro) { cons.classList.remove('hidden'); cons.textContent = s.A[key + '#out']; }
  return wrap;

// ----------------------------------------------------------------------- flowchart builder
const SHAPES = { start: 'Start / End', io: 'Input / Output', proc: 'Process', dec: 'Decision' };
function flowPart(p) {
  const s = S.cur; const key = p.id; need(key);
  let steps = Array.isArray(s.A[key]) ? JSON.parse(JSON.stringify(s.A[key])) : [{ shape: 'start', text: 'START', next: '' }, { shape: 'start', text: 'END', next: '' }];
  const wrap = el('div', { class: 'flow' });
  const left = el('div'); const right = el('div', { class: 'svgbox' });
  wrap.append(left, right);
  const save = () => { setA(key, steps.length > 2 || steps.some(x => x.text && !['START', 'END'].includes(x.text)) ? JSON.parse(JSON.stringify(steps)) : null); draw(); };
  function rows() {
    left.innerHTML = '';
    const tb = el('table', null, el('tr', null, ['No.', 'Shape', 'Text', 'Next / Yes →', 'No →', ''].map(h => el('th', { text: h }))));
    steps.forEach((st, i) => {
      const sel = el('select', { disabled: s.ro }, Object.entries(SHAPES).map(([k, v]) => el('option', { value: k, text: v, selected: st.shape === k })));
      sel.onchange = () => { st.shape = sel.value; rows(); save(); };
      const tx = el('input', { type: 'text', value: st.text || '', disabled: s.ro, placeholder: st.shape === 'dec' ? 'condition?' : '' }); tx.oninput = () => { st.text = tx.value; save(); };
      const nx = el('input', { type: 'text', value: st.next || '', disabled: s.ro, style: 'width:52px', placeholder: i + 2 <= steps.length ? String(i + 2) : '' }); nx.oninput = () => { st.next = nx.value.trim(); save(); };
      const no = st.shape === 'dec' ? el('input', { type: 'text', value: st.no || '', disabled: s.ro, style: 'width:52px' }) : el('span', { class: 'small', text: '—' });
      if (st.shape === 'dec') no.oninput = () => { st.no = no.value.trim(); save(); };
      const x = el('button', { class: 'x', type: 'button', text: '✕', title: 'delete this block', disabled: s.ro, onclick: () => { steps.splice(i, 1); rows(); save(); } });
      tb.append(el('tr', null, el('td', { text: i + 1, style: 'font-weight:800' }), el('td', null, sel), el('td', null, tx), el('td', null, nx), el('td', null, no), el('td', null, x)));
    });
    left.append(tb);
    if (!s.ro) {
      const addAt = el('select', null, steps.map((_, i) => el('option', { value: i + 1, text: 'after block ' + (i + 1), selected: i === steps.length - 2 })));
      left.append(el('div', { class: 'tools' },
        el('button', { class: 'btn sec', type: 'button', text: '+ Add block', onclick: () => { const at = +addAt.value; steps.splice(at, 0, { shape: 'proc', text: '', next: '' }); rows(); save(); } }), addAt));
    }
    left.append(el('p', { class: 'small', html: '<b>Next / Yes →</b> leave empty to go to the next block. For a <b>Decision</b> write the block number for <b>Yes</b> and for <b>No</b>. To make a loop, point an arrow back to an earlier block number.' }));
  }
  function draw() {
    const W = 520, bw = 210, bh = 46, gap = 34, x0 = 150;
    const n = steps.length; const Ht = n * (bh + gap) + 30;
    const cy = i => 20 + i * (bh + gap) + bh / 2;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Ht}" width="${W}" font-family="Nunito,sans-serif" font-size="12">`;
    svg += '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d2b4f"/></marker></defs>';
    let lane = 0;
    const tgt = v => { const k = parseInt(v, 10); return k >= 1 && k <= n ? k - 1 : null; };
    steps.forEach((st, i) => {
      const y = cy(i);
      const edges = [];
      const isEnd = st.shape === 'start' && /end|stop/i.test(st.text || '');
      if (st.shape === 'dec') {
        const y1 = tgt(st.next) ?? (i + 1 < n ? i + 1 : null); const n1 = tgt(st.no);
        if (y1 != null) edges.push([y1, 'Yes']); if (n1 != null) edges.push([n1, 'No']);
      } else if (!isEnd) {
        const t = st.next ? tgt(st.next) : (i + 1 < n ? i + 1 : null); if (t != null) edges.push([t, '']);
      }
      edges.forEach(([t, lab], ei) => {
        if (t === i + 1 && (st.shape !== 'dec' || ei === 0)) {
          svg += `<line x1="${x0 + bw / 2}" y1="${y + bh / 2}" x2="${x0 + bw / 2}" y2="${cy(t) - bh / 2}" stroke="#1d2b4f" stroke-width="1.6" marker-end="url(#ah)"/>`;
          if (lab) svg += `<text x="${x0 + bw / 2 + 6}" y="${y + bh / 2 + 14}" fill="#0f6b72" font-weight="700">${lab}</text>`;
        } else {
          lane++;
          const right = t >= i;  // forward jumps on the right, loops back on the left
          const side = right ? x0 + bw : x0;
          const lx = right ? x0 + bw + 14 + lane * 12 : x0 - 14 - lane * 12;
          const sx = st.shape === 'dec' ? (right ? x0 + bw : x0) : side;
          svg += `<polyline points="${sx},${y} ${lx},${y} ${lx},${cy(t)} ${right ? x0 + bw : x0},${cy(t)}" fill="none" stroke="#1d2b4f" stroke-width="1.6" marker-end="url(#ah)"/>`;
          if (lab) svg += `<text x="${right ? sx + 4 : sx - 24}" y="${y - 5}" fill="#0f6b72" font-weight="700">${lab}</text>`;
        }
      });
    });
    steps.forEach((st, i) => {
      const y = cy(i) - bh / 2, xm = x0 + bw / 2;
      const fill = { start: '#e9f5f3', io: '#fff7e9', proc: '#ffffff', dec: '#f3effb' }[st.shape];
      if (st.shape === 'start') svg += `<rect x="${x0}" y="${y}" width="${bw}" height="${bh}" rx="23" fill="${fill}" stroke="#1d2b4f" stroke-width="1.6"/>`;
      else if (st.shape === 'io') svg += `<polygon points="${x0 + 18},${y} ${x0 + bw},${y} ${x0 + bw - 18},${y + bh} ${x0},${y + bh}" fill="${fill}" stroke="#1d2b4f" stroke-width="1.6"/>`;
      else if (st.shape === 'dec') svg += `<polygon points="${xm},${y - 6} ${x0 + bw + 8},${y + bh / 2} ${xm},${y + bh + 6} ${x0 - 8},${y + bh / 2}" fill="${fill}" stroke="#1d2b4f" stroke-width="1.6"/>`;
      else svg += `<rect x="${x0}" y="${y}" width="${bw}" height="${bh}" fill="${fill}" stroke="#1d2b4f" stroke-width="1.6"/>`;
      const txt = esc(st.text || ''); const lines = txt.length > 30 ? [txt.slice(0, 30), txt.slice(30, 60)] : [txt];
      lines.forEach((ln, k) => svg += `<text x="${xm}" y="${y + bh / 2 + 4 + (k - (lines.length - 1) / 2) * 13}" text-anchor="middle" fill="#1f2633">${ln}</text>`);
      svg += `<text x="${x0 - 6 - (st.shape === 'dec' ? 8 : 0)}" y="${y + 12}" text-anchor="end" fill="#8a94a6" font-size="11" font-weight="700">${i + 1}</text>`;
    });
    svg += '</svg>';
    right.innerHTML = svg;
  }
  rows(); draw();
  return wrap;
}

// ----------------------------------------------------------------------- chart from a table column
function chartPart(p) {
  const s = S.cur; const k = p.id;
  ['title', 'x', 'y'].forEach(f => need(`${k}.${f}`));
  const src = COURSE.course.flatMap(l => (l.tasks || []).flatMap(t => t.parts)).find(q => q.id === p.source);
  const fld = (f, lab, ph) => { const i = el('input', { type: 'text', placeholder: ph, disabled: s.ro }); i.value = s.A[`${k}.${f}`] || ''; i.oninput = () => setA(`${k}.${f}`, i.value); return el('div', null, el('label', { class: 'small', text: lab }), i); };
  const box = el('div', { class: 'chart' });
  const svgHost = el('div');
  box.append(el('div', { class: 'chartfields' }, fld('title', 'Graph title', 'e.g. …'), fld('x', 'x-axis label (with unit)', ''), fld('y', 'y-axis label (with unit)', '')), svgHost);
  const num = v => { const x = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(x) ? x : null; };
  function draw() {
    const pts = src.rows.map((row, r) => {
      const xv = num(row[p.xcol] !== '' ? row[p.xcol] : s.A[`${src.id}.r${r}c${p.xcol}`]);
      const yv = num(row[p.ycol] !== '' ? row[p.ycol] : s.A[`${src.id}.r${r}c${p.ycol}`]);
      return xv != null && yv != null ? [xv, yv] : null;
    }).filter(Boolean);
    const W = 640, Hh = 380, L = 70, R = 44, T = 40, B = 60;
    const kfmt = v => v >= 1e6 ? +(v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? +(v / 1e3).toFixed(1) + 'k' : String(v);
    const xmax = Math.max(...pts.map(q => q[0]), 1), ymax = Math.max(...pts.map(q => q[1]), 0.0001);
    const sx = v => L + (W - L - R) * v / xmax, sy = v => Hh - B - (Hh - T - B) * v / ymax;
    let g = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" font-family="Nunito,sans-serif" font-size="12">`;
    g += `<text x="${W / 2}" y="22" text-anchor="middle" font-weight="700" font-size="15" fill="#1d2b4f">${esc(s.A[`${k}.title`] || '(title)')}</text>`;
    for (let i = 0; i <= 4; i++) { const yv = ymax * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${sy(yv)}" y2="${sy(yv)}" stroke="#eef1f7"/><text x="${L - 6}" y="${sy(yv) + 4}" text-anchor="end" fill="#5b6576">${+yv.toPrecision(3)}</text>`; }
    pts.forEach(q => g += `<text x="${sx(q[0])}" y="${Hh - B + 16}" text-anchor="middle" fill="#5b6576">${kfmt(q[0])}</text>`);
    g += `<line x1="${L}" y1="${Hh - B}" x2="${W - R}" y2="${Hh - B}" stroke="#1d2b4f"/><line x1="${L}" y1="${T}" x2="${L}" y2="${Hh - B}" stroke="#1d2b4f"/>`;
    g += `<text x="${(W + L) / 2}" y="${Hh - 18}" text-anchor="middle" fill="#1d2b4f" font-weight="700">${esc(s.A[`${k}.x`] || '(x-axis label)')}</text>`;
    g += `<text transform="translate(18 ${(Hh - B + T) / 2}) rotate(-90)" text-anchor="middle" fill="#1d2b4f" font-weight="700">${esc(s.A[`${k}.y`] || '(y-axis label)')}</text>`;
    if (pts.length > 1) g += `<polyline points="${pts.map(q => sx(q[0]) + ',' + sy(q[1])).join(' ')}" fill="none" stroke="#0f6b72" stroke-width="2.5"/>`;
    pts.forEach(q => g += `<circle cx="${sx(q[0])}" cy="${sy(q[1])}" r="5" fill="#ee9b2f" stroke="#1d2b4f"/>`);
    if (!pts.length) g += `<text x="${W / 2}" y="${Hh / 2}" text-anchor="middle" fill="#8a94a6">Fill the Average column of your table to see the points.</text>`;
    g += '</svg>';
    svgHost.innerHTML = g;
  }
  s.listeners.add(key => { if (key.startsWith(src.id) || key.startsWith(k)) draw(); });
  draw();
  return box;
}

        el('div', { class: 'or', text: 'or with e-mail and password' }));
    }
    box.append(el('label', { text: 'School e-mail' }), email, el('label', { text: 'Password' }), pw,
      el('button', { class: 'btn', type: 'button', style: 'width:100%;margin-top:16px', text: 'Log in', onclick: doLogin }),
      el('div', { class: 'small', style: 'margin-top:10px', text: 'Forgot your password? Ask your teacher — only the teacher can give or change passwords.' }));
  }
  box.append(err);
  app.append(el('div', { class: 'login' }, box));
}

function renderShell(app) {
  app.innerHTML = '';
  const total = Math.round(COURSE.course.reduce((a, L) => { const d = S.progress[L.n]; return a + (d ? ((d.done || d.submitted) ? 100 : d.pct || 0) : 0); }, 0) / 30);
  const top = el('div', { class: 'top' },
    el('div', { class: 'brand', onclick: () => go(S.user.isTeacher ? '#/teacher' : '#/home') }, 'Data Structures and Algorithms', el('small', { text: 'MYP CS · Grade 10 · Unit 2' })),
    el('span', { class: 'sp' }),
    S.user.isTeacher ? null : el('div', { class: 'bar', title: total + '% of the unit' }, el('i', { style: `width:${total}%` })),
    el('span', { class: 'who', text: S.user.name + (S.user.isTeacher ? ' (teacher)' : '') }),
    S.user.isTeacher ? el('button', { type: 'button', text: 'Dashboard', onclick: () => go('#/teacher') }) : null,
    el('button', { type: 'button', text: S.user.isTeacher ? 'Lessons' : 'My lessons', onclick: () => go('#/home') }),
    Backend.mode === 'firebase' && S.user.isTeacher ? el('button', { type: 'button', text: 'Account', onclick: () => go('#/account') }) : null,
    el('button', { type: 'button', text: 'Log out', onclick: async () => { if (S.cur) await saveNow(); history.replaceState(null, '', location.pathname); Backend.logout(); } }));
  app.append(top, el('main', { id: 'main' }));
}

function go(h) { if (location.hash === h) route(); else location.hash = h; }
async function route() {
  if (!S.user) return;
  if (S.cur && S.cur.dirty && !S.cur.ro) await saveNow();
  const app = $('#app');
  renderShell(app);
  const main = $('#main');
  const h = location.hash || (S.user.isTeacher ? '#/teacher' : '#/home');
  let m;
  if ((m = h.match(/^#\/lesson\/(\d+)/)) && +m[1] >= 1 && +m[1] <= 30) openLesson(+m[1], main);
  else if (h.startsWith('#/teacher') && S.user.isTeacher) renderTeacher(main);
  else if (h.startsWith('#/account') && S.user.isTeacher) renderAccount(main);
  else renderHome(main);
  if (!h.startsWith('#/lesson')) Backend.heartbeat(null);
}
window.addEventListener('hashchange', route);
setInterval(() => { if (S.user && !document.hidden) Backend.heartbeat(S.cur && !S.cur.ro ? S.cur.n : null); }, 90000);

async function boot() {
  const app = $('#app');
  app.innerHTML = '<div class="login"><div class="box"><span class="spinner"></span> Loading…</div></div>';
  try { await Backend.init(); } catch (e) { app.innerHTML = '<div class="login"><div class="box"><h1>Cannot connect</h1><p>' + esc(e.message) + '</p><p class="small">Check the internet connection and the Firebase settings in the file.</p></div></div>'; return; }
  Backend.onAuth(async u => {
    S.unsub.forEach(f => f && f()); S.unsub = [];
    T.unsub.forEach(f => f && f()); T.unsub = [];
    S.user = u; S.cur = null;
    if (!u) { renderLogin(app); return; }
    app.innerHTML = '<div class="login"><div class="box"><span class="spinner"></span> Loading your work…</div></div>';
    try { S.progress = await Backend.loadMyProgress(); } catch (e) { console.error(e); S.progress = {}; }
    let first = true;
    S.unsub.push(Backend.watchConfig(c => { S.config = { schedule: {}, closed: [], ...(c || {}) }; if (!first && !S.cur) route(); }));
    S.unsub.push(Backend.watchMyFeedback(f => { S.feedback = f || {}; if (!first && !S.cur) route(); }));
    if (u.isTeacher) teacherStart();
    first = false;
    route();
    // start Python in the background so the first Run is fast
    setTimeout(() => PY.ensure().catch(() => {}), 1500);
  });
}
boot();

</script>
